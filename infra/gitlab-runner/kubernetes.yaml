apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-deployer
  namespace: hello-world
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-deployer
  namespace: hello-world
rules:
  - apiGroups: ['']
    resources: [pods, services, secrets, configmaps, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-deployer
  namespace: hello-world
subjects:
  - kind: ServiceAccount
    name: gitlab-deployer
    namespace: hello-world
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-deployer
---
# A persistent credential for this local lab; recreate this Secret to rotate it.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-deployer-token
  namespace: hello-world
  annotations:
    kubernetes.io/service-account.name: gitlab-deployer
type: kubernetes.io/service-account-token

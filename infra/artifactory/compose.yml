name: organization-artifactory

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: artifactory
      POSTGRES_USER: artifactory
      POSTGRES_PASSWORD: ${ARTIFACTORY_DB_PASSWORD:?Run the local setup to create .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artifactory -d artifactory']
      interval: 10s
      timeout: 5s
      retries: 10

  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-jcr:7.161.15
    restart: unless-stopped
    cpus: 4
    mem_limit: 6g
    environment:
      # JCR does not ship JFConnect; enabling it prevents UI login.
      JF_JFCONNECT_ENABLED: "false"
      JF_SHARED_DATABASE_TYPE: postgresql
      JF_SHARED_DATABASE_DRIVER: org.postgresql.Driver
      JF_SHARED_DATABASE_URL: jdbc:postgresql://postgres:5432/artifactory
      JF_SHARED_DATABASE_USERNAME: artifactory
      JF_SHARED_DATABASE_PASSWORD: ${ARTIFACTORY_DB_PASSWORD:?Run the local setup to create .env}
      JF_SHARED_EXTRAJAVAOPTS: '-Xms512m -Xmx2g'
    ports:
      - '127.0.0.1:8081:8081'
    volumes:
      - data:/var/opt/jfrog/artifactory
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8081/artifactory/api/system/ping']
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 10

  gateway:
    image: nginx@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - '127.0.0.1:8082:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      artifactory:
        condition: service_healthy

volumes:
  database:
  data:

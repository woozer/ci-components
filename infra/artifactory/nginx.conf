# Give Docker an ordinary HTTP endpoint, without the JFrog router's TLS/SNI listener.
server {
    listen 80;
    server_name _;
    client_max_body_size 0;
    # Registry token queries and credentials must not appear in gateway access logs.
    access_log off;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $artifactory_backend artifactory:8082;
        proxy_pass http://$artifactory_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

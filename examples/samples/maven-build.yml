# One independently usable module. Provide the approved JAVA_CI_IMAGE variable.
spec:
  inputs:
    library-ref:
      description: 'Immutable component commit SHA'
    library-project:
      default: root/ci-components
---
stages: [build]

include:
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/maven-build@$[[ inputs.library-ref ]]
    inputs:
      image: $JAVA_CI_IMAGE
      maven-executable: mvn

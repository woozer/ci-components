# The consuming repository supplies its POM and Cucumber/Failsafe tests.
spec:
  inputs:
    library-ref:
      description: 'Immutable component commit SHA'
    library-project:
      default: root/ci-components
---
stages: [build, test]

include:
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/maven-build@$[[ inputs.library-ref ]]
    inputs:
      image: $JAVA_CI_IMAGE
      maven-executable: mvn
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/cucumber-test@$[[ inputs.library-ref ]]
    inputs:
      image: $JAVA_CI_IMAGE
      stage: test
      maven-executable: mvn
      target-url-variable: ''
      tags: 'not @ui and not @ignore'

cucumber-test:
  needs:
    - job: maven-build
      artifacts: true

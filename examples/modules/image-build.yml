# Minimal module usage. Supply the documented runtime prerequisites.
spec:
  inputs:
    library-ref:
      description: 'Immutable component commit SHA'
    library-project:
      default: root/ci-components
---
stages: [package]

include:
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/image-build@$[[ inputs.library-ref ]]
    inputs:
      image: $BUILDKIT_CI_IMAGE

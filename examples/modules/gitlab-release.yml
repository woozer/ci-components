# Minimal module usage. Supply the documented runtime prerequisites.
spec:
  inputs:
    library-ref:
      description: 'Released component version or full commit SHA'
    library-project:
      default: root/ci-components
    api-url:
      default: '$CI_API_V4_URL'
    artifact-base-url:
      default: ''
---
stages: [finish]

include:
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/gitlab-release@$[[ inputs.library-ref ]]
    inputs:
      image: $JAVA_CI_IMAGE
      version: "$RELEASE_VERSION"
      image-ref-variable: "JIB_BUILD_IMAGE_REF"
      chart-ref-variable: "HELM_PUBLISH_REF"
      chart-version-variable: "HELM_PUBLISH_VERSION"
      api-url: '$[[ inputs.api-url ]]'
      artifact-base-url: '$[[ inputs.artifact-base-url ]]'

gitlab-release:
  when: manual

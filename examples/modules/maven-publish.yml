# Minimal module usage. Supply the documented runtime prerequisites.
spec:
  inputs:
    library-ref:
      description: 'Immutable component commit SHA'
    library-project:
      default: root/ci-components
---
stages: [publish]

include:
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/maven-publish@$[[ inputs.library-ref ]]
    inputs:
      image: $JAVA_CI_IMAGE
      settings-file: "$MAVEN_SETTINGS_FILE"
      repository-url: "$MAVEN_REPOSITORY_URL"

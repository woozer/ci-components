# Minimal module usage. Supply the documented runtime prerequisites.
spec:
  inputs:
    library-ref:
      description: 'Released component version or full commit SHA'
    library-project:
      default: root/ci-components
---
stages: [integration]

include:
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/cucumber-test@$[[ inputs.library-ref ]]
    inputs:
      image: $JAVA_CI_IMAGE
      target-url-variable: ""
      tags: 'not @ui and not @ignore'

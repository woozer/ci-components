# Minimal module usage. Supply the documented runtime prerequisites.
spec:
  inputs:
    library-ref:
      description: 'Released component version or full commit SHA'
    library-project:
      default: root/ci-components
---
stages: [test]

include:
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/npm-test@$[[ inputs.library-ref ]]
    inputs:
      image: $NODE_CI_IMAGE
      working-directory: "ui"

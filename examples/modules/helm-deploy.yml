# Minimal module usage. Supply the documented runtime prerequisites.
spec:
  inputs:
    library-ref:
      description: 'Released component version or full commit SHA'
    library-project:
      default: root/ci-components
    plain-http:
      type: boolean
      default: false
---
stages: [deploy-test]

include:
  - project: $[[ inputs.library-project ]]
    ref: $[[ inputs.library-ref ]]
    file: /shared/helm.yml
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/helm-deploy@$[[ inputs.library-ref ]]
    inputs:
      image: $HELM_CI_IMAGE
      image-ref-variable: "JIB_BUILD_IMAGE_REF"
      chart-variable: "HELM_PUBLISH_REF"
      chart-version-variable: "HELM_PUBLISH_VERSION"
      kubeconfig-variable: "DEPLOY_KUBECONFIG"
      values-file: "environment/cluster/test.yaml"
      release: "$CI_PROJECT_NAME"
      namespace: "$TEST_NAMESPACE"
      environment: "test"
      target-url: "$TEST_URL"
      create-namespace: false
      plain-http: $[[ inputs.plain-http ]]

helm-deploy:
  before_script:
    - !reference [.helm-login, before_script]

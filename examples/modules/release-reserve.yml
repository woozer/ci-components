# Minimal module usage. Supply the documented runtime prerequisites.
spec:
  inputs:
    library-ref:
      description: 'Immutable component commit SHA'
    library-project:
      default: root/ci-components
---
stages: [release]

include:
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/release-reserve@$[[ inputs.library-ref ]]
    inputs:
      image: $JAVA_CI_IMAGE

release-reserve:
  when: manual

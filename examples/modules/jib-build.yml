# Minimal module usage. Supply the documented runtime prerequisites.
spec:
  inputs:
    library-ref:
      description: 'Released component version or full commit SHA'
    library-project:
      default: root/ci-components
    plain-http:
      type: boolean
      default: false
    version:
      default: '$APP_VERSION'
---
stages: [package]

include:
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/jib-build@$[[ inputs.library-ref ]]
    inputs:
      image: $JAVA_CI_IMAGE
      project-selector: "hello-app"
      settings-file: "$ARTIFACTORY_MAVEN_SETTINGS"
      image-repository: "$IMAGE_REPOSITORY"
      image-tag: '$[[ inputs.version ]]'
      base-image: "$JAVA_RUNTIME_IMAGE"
      digest-file: "hello-app/target/jib-image.digest"
      allow-insecure-registry: $[[ inputs.plain-http ]]

# Minimal module usage. Supply the documented runtime prerequisites.
spec:
  inputs:
    library-ref:
      description: Immutable component commit SHA
    library-project:
      default: root/ci-components
---
stages: [analyze]

include:
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/sonar@$[[ inputs.library-ref ]]
    inputs:
      image: $SONAR_IMAGE

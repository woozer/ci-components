# Minimal module usage. Supply the documented runtime prerequisites.
spec:
  inputs:
    library-ref:
      description: 'Released component version or full commit SHA'
    library-project:
      default: root/ci-components
---
stages: [check]

include:
  - component: $CI_SERVER_FQDN/$[[ inputs.library-project ]]/release-check@$[[ inputs.library-ref ]]
    inputs:
      image: $JAVA_CI_IMAGE
      image-path: "$IMAGE_REPOSITORY_PATH"
      version: "$RELEASE_VERSION"
      commit: "$RELEASE_COMMIT_SHA"

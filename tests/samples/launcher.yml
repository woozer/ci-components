require-protected-main:
  stage: test
  tags: [local-docker]
  image: $JAVA_CI_IMAGE
  rules:
    - if: '"$[[ inputs.sample ]]" =~ /^module-(sonar|release-reserve|release-check|gitlab-release)$/ && ($CI_COMMIT_REF_PROTECTED != "true" || $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH)'
  script:
    - echo 'This sample requires the protected default branch and its scoped test credentials.' >&2
    - exit 1

# Configure CI_VALIDATION_IMAGE to a digest-pinned image with Python 3 and Ruby.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

stages: [test, integration]

validate-components:
  stage: test
  tags: [local-docker]
  image:
    name: $CI_VALIDATION_IMAGE
    entrypoint: [""]
  script:
    - python3 -m unittest discover -s tests -p 'test_*.py' -v

include:
  - local: /tests/samples/component-validation.yml

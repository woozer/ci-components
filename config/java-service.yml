# Organization profile for the local lab. Applications only supply required inputs.
# Generic job implementations and release policy remain in /pipelines/.
spec:
  inputs:
    library-ref:
      description: 'Immutable commit of this CI library; use the same commit as include.ref'
      type: string
    maven-project:
      description: 'Maven module containing the deployable application and Jib'
      type: string
    application:
      description: 'Application name; defaults to the GitLab project name'
      type: string
      default: '$CI_PROJECT_NAME'
    chart:
      description: 'Helm chart directory; defaults to helm/<GitLab project name>'
      type: string
      default: 'helm/$CI_PROJECT_NAME'
    namespace:
      description: 'Existing dev namespace; defaults to the GitLab project name'
      type: string
      default: '$CI_PROJECT_NAME'
    environment-directory:
      description: 'Directory containing cluster/ and user/ Helm values'
      type: string
      default: environment
    cluster:
      description: 'Initial cluster selection; local is the only provisioned cluster in this lab'
      type: string
      default: local
      options: [local]
    user-config:
      description: 'Initial Helm user profile selection'
      type: string
      default: default
      options: [default, two-replicas]
    pipeline-mode:
      description: 'Initial selection for how far the pipeline runs'
      type: string
      default: deploy
      options: [validate, publish, deploy]
---
include:
  - local: /config/organization.yml
  - local: /templates/pipeline-select.yml
    inputs:
      job-name: configure
      image: $MAVEN_BUILD_IMAGE
      # This lab has one real cluster. Add other mappings here when provisioned.
      clusters: [local]
      user-configs: [default, two-replicas]
      default-cluster: '$[[ inputs.cluster ]]'
      default-user-config: '$[[ inputs.user-config ]]'
      default-pipeline-mode: '$[[ inputs.pipeline-mode ]]'
      pipeline-config: |
        include:
          - project: root/ci-components
            ref: '$[[ inputs.library-ref ]]'
            file: /pipelines/java-service.yml
            inputs:
              library-ref: '$[[ inputs.library-ref ]]'
              application: '$[[ inputs.application | expand_vars ]]'
              maven-project: '$[[ inputs.maven-project ]]'
              chart: '$[[ inputs.chart | expand_vars ]]'
              namespace: '$[[ inputs.namespace | expand_vars ]]'
              values-file: '$[[ inputs.environment-directory ]]/cluster/@CLUSTER@.yaml'
              user-values-file: '$[[ inputs.environment-directory ]]/user/@USER_CONFIG@.yaml'
              pipeline-mode: '@PIPELINE_MODE@'
              kubeconfig-variable: LOCAL_KUBECONFIG
              dev-url: http://host.docker.internal:8080
              dev-public-url: http://localhost:8080
              plain-http: true

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - when: never

stages: [configure, pipeline]

default:
  tags: [local-docker]

run-pipeline:
  stage: pipeline
  needs: [configure]
  inherit:
    variables: false
  trigger:
    include:
      - artifact: .ci-output/configure/pipeline.yml
        job: configure
    strategy: mirror

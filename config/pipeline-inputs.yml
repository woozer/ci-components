# Shared New pipeline form. Automatic pipelines use these defaults.
inputs:
  cluster:
    description: 'Target cluster; credentials are mapped in the organization profile'
    type: string
    default: local
    options: [local]
  user_config:
    description: 'Helm values from environment/user/<selection>.yaml'
    type: string
    default: default
    options: [default, two-replicas]
  pipeline_mode:
    description: 'validate: build/tests; publish: add artifacts; deploy: add Helm and HTTP tests'
    type: string
    default: deploy
    options: [validate, publish, deploy]

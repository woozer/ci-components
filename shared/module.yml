# Common hook lifecycle and output contract for every component.
# References keep consumer job-level extends available for application defaults.
.ci-module:
  before_script:
    - |
      set -eu
      cd "$CI_PROJECT_DIR/$MODULE_WORKDIR"
      export CI_MODULE_OUTPUT_DIR="$CI_PROJECT_DIR/.ci-output/$CI_JOB_NAME"
      mkdir -p "$CI_MODULE_OUTPUT_DIR"
      rm -f "$CI_MODULE_OUTPUT_DIR/outputs.env"
      # A prefix belongs to one producer. Never silently reuse an imported namespace.
      if printenv "${MODULE_OUTPUT_PREFIX}_STATUS" >/dev/null; then
        echo "Output prefix $MODULE_OUTPUT_PREFIX is already in use; choose a unique output-prefix" >&2
        exit 1
      fi
      # Check only artifacts downloaded by GitLab; never evaluate their contents as shell code.
      set -- "$CI_PROJECT_DIR"/.ci-output/*/outputs.env
      if [ -f "$1" ]; then
        awk -F= '
          $1 !~ /^[A-Z][A-Z0-9_]*$/ { print "Invalid upstream output name"; exit 1 }
          seen[$1]++ { print "Duplicate upstream output: " $1; exit 1 }
        ' "$@" >&2
        for module_input_file do
          while IFS= read -r module_input_line; do
            module_input_key=${module_input_line%%=*}
            module_input_expected=${module_input_line#*=}
            module_input_actual=$(printenv "$module_input_key") || {
              echo "Missing imported output: $module_input_key; check needs with artifacts" >&2; exit 1;
            }
            if [ "$module_input_actual" != "$module_input_expected" ]; then
              echo "Imported output overridden: $module_input_key; reserve output names for their producer" >&2
              exit 1
            fi
          done < "$module_input_file"
        done
      fi
      export CI_MODULE_EXTRA_OUTPUTS="$CI_MODULE_OUTPUT_DIR/custom.env"
      export CI_MODULE_PARAMETERS_FILE="$CI_MODULE_OUTPUT_DIR/hook-parameters.json"
      printf '%s\n' "$MODULE_HOOK_PARAMETERS_JSON" > "$CI_MODULE_PARAMETERS_FILE"
      : > "$CI_MODULE_EXTRA_OUTPUTS"
      : > "$CI_MODULE_OUTPUT_DIR/pending.env"
      emit() {
        emit_newline='
      '
        emit_cr=$(printf '\r')
        case "$2" in
          ''|*"$emit_newline"*|*"$emit_cr"*|*'${'*)
            echo "Invalid output value for $1" >&2; return 1 ;;
        esac
        printf '%s_%s=%s\n' "$MODULE_OUTPUT_PREFIX" "$1" "$2" >> "$CI_MODULE_OUTPUT_DIR/pending.env"
      }
      runtime_input() {
        printenv "$1" || { echo "Missing upstream output variable $1; add its producer to needs" >&2; return 1; }
      }
      image_input() {
        runtime_ref=$(runtime_input "$1")
        printf '%s\n' "$runtime_ref" | LC_ALL=C grep -Eq '^.+@sha256:[a-f0-9]{64}$' || {
          echo "Expected an immutable image digest from $1" >&2; return 1;
        }
        printf '%s\n' "$runtime_ref"
      }
      if [ -n "$MODULE_PRE_HOOK" ]; then
        sh "$CI_PROJECT_DIR/$MODULE_PRE_HOOK"
      fi
  # A component appends this after its own operation:
  #   - !reference [.ci-module, script]
  # GitLab inserts the command list below into that component's script.
  # .ci-module is this hidden YAML definition; script selects this section.
  # It runs in the calling job's image and shell, without starting another job.
  # These commands run the post-hook, then validate and publish output variables:
  # valid/unique names, custom prefixes, nonempty single-line values, <= 5 KB.
  # Publishing means writing outputs.env, not uploading packages or images.
  # The component's artifacts:reports:dotenv exposes these variables via needs.
  # Keep this in script: a failed post-hook must fail the job and block outputs.
  # after_script below is separate, best-effort cleanup in a fresh shell.
  script:
    - |
      if [ -n "$MODULE_POST_HOOK" ]; then
        sh "$CI_PROJECT_DIR/$MODULE_POST_HOOK"
      fi
      emit STATUS passed
      emit COMMIT_SHA "$CI_COMMIT_SHA"
      emit PIPELINE_ID "$CI_PIPELINE_ID"
      # Hook outputs are namespaced and cannot replace built-in output fields.
      awk -F= -v prefix="${MODULE_OUTPUT_PREFIX}_CUSTOM_" '
        index($1, prefix) != 1 { exit 1 }
      ' "$CI_MODULE_EXTRA_OUTPUTS"
      cat "$CI_MODULE_EXTRA_OUTPUTS" >> "$CI_MODULE_OUTPUT_DIR/pending.env"
      awk '
        {
          p = index($0, "="); key = substr($0, 1, p - 1); value = substr($0, p + 1)
          if (p < 2 || key !~ /^[A-Z][A-Z0-9_]*$/ || seen[key]++ || value == "" ||
              value ~ /^[[:space:]]/ || value ~ /[[:space:]]$/ || value ~ /\r/ ||
              index(value, "${")) exit 1
        }
      ' "$CI_MODULE_OUTPUT_DIR/pending.env"
      test "$(wc -c < "$CI_MODULE_OUTPUT_DIR/pending.env")" -le 5120
      # Project/group/pipeline variables must not shadow a generated output, even if equal.
      while IFS= read -r module_output_line; do
        module_output_key=${module_output_line%%=*}
        if printenv "$module_output_key" >/dev/null; then
          echo "Output name already exists in the environment: $module_output_key" >&2
          exit 1
        fi
      done < "$CI_MODULE_OUTPUT_DIR/pending.env"
      mv "$CI_MODULE_OUTPUT_DIR/pending.env" "$CI_MODULE_OUTPUT_DIR/outputs.env"
  # GitLab runs cleanup in a fresh shell; it cannot fail a successful job.
  after_script:
    - |
      set -eu
      cd "$CI_PROJECT_DIR/$MODULE_WORKDIR"
      export CI_MODULE_OUTPUT_DIR="$CI_PROJECT_DIR/.ci-output/$CI_JOB_NAME"
      export CI_MODULE_EXTRA_OUTPUTS="$CI_MODULE_OUTPUT_DIR/custom.env"
      export CI_MODULE_PARAMETERS_FILE="$CI_MODULE_OUTPUT_DIR/hook-parameters.json"
      if [ -n "$MODULE_CLEANUP_HOOK" ]; then
        sh "$CI_PROJECT_DIR/$MODULE_CLEANUP_HOOK"
      fi

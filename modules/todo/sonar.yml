# Analyze Maven/Java sources and enforce the Sonar quality gate
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'sonar'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'analyze'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'SONAR'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    maven-executable:
      description: 'Maven executable in the image or wrapper in the working directory'
      type: string
      default: ./mvnw
    gate-timeout:
      description: 'Seconds SonarScanner waits for the quality gate; within job-timeout'
      type: string
      default: '300'
      regex: '^[1-9][0-9]*$'
    scanner-version:
      description: 'Approved exact sonar-maven-plugin version'
      type: 'string'
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    MAVEN_EXECUTABLE: '$[[ inputs.maven-executable ]]'
    SONAR_GATE_TIMEOUT: '$[[ inputs.gate-timeout ]]'
    SONAR_SCANNER_VERSION: '$[[ inputs.scanner-version ]]'
    GIT_DEPTH: '0'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      : "${SONAR_HOST_URL:?Configure SONAR_HOST_URL}"
      : "${SONAR_TOKEN:?Configure a scoped SONAR_TOKEN}"
      : "${SONAR_PROJECT_KEY:?Configure SONAR_PROJECT_KEY}"
      # Install resolves reactor modules for analysis; tests/coverage run in their own jobs.
      "$MAVEN_EXECUTABLE" --batch-mode --no-transfer-progress -DskipTests -DskipITs install \
        "org.sonarsource.scanner.maven:sonar-maven-plugin:$SONAR_SCANNER_VERSION:sonar" \
        "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
        "-Dsonar.scanner.metadataFilePath=$CI_MODULE_OUTPUT_DIR/report-task.txt" \
        -Dsonar.qualitygate.wait=true \
        "-Dsonar.qualitygate.timeout=$SONAR_GATE_TIMEOUT"
      test -s "$CI_MODULE_OUTPUT_DIR/report-task.txt"
      emit TASK_FILE ".ci-output/$CI_JOB_NAME/report-task.txt"
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

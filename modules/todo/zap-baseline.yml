# Run a passive ZAP baseline scan of the test deployment
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'zap-baseline'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'integration'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'ZAP_BASELINE'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    target-url-variable:
      description: 'Name of upstream deployment URL output'
      type: 'string'
      default: 'HELM_DEPLOY_URL'
      regex: '^[A-Z][A-Z0-9_]*$'
    rules-file:
      description: 'Repository-relative reviewed baseline rule configuration'
      type: 'string'
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    TARGET_URL_VARIABLE: '$[[ inputs.target-url-variable ]]'
    ZAP_RULES: '$[[ inputs.rules-file ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      target_url=$(runtime_input "$TARGET_URL_VARIABLE")
      mkdir -p /zap/wrk
      cp "$CI_PROJECT_DIR/$ZAP_RULES" /zap/wrk/rules.tsv
      zap_status=0
      zap-baseline.py -t "$target_url" -c rules.tsv -J report.json -r report.html || zap_status=$?
      for report_file in /zap/wrk/report.json /zap/wrk/report.html; do
        if [ -f "$report_file" ]; then cp "$report_file" "$CI_MODULE_OUTPUT_DIR/"; fi
      done
      # Exit 1 means FAIL, 2 WARN, 3 scanner error; all block by default.
      test "$zap_status" -eq 0
      test -s "$CI_MODULE_OUTPUT_DIR/report.json"
      emit REPORT_DIR ".ci-output/$CI_JOB_NAME"
      emit TARGET_URL "$target_url"
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

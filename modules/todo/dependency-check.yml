# Check Maven dependencies against known vulnerabilities
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'dependency-check'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'analyze'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '1h'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'DEPENDENCY_CHECK'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    plugin-version:
      description: 'Approved exact dependency-check-maven version'
      type: 'string'
    fail-cvss:
      description: 'Fail at the organization''s agreed CVSS threshold'
      type: 'number'
      default: 7
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    DEPENDENCY_CHECK_VERSION: '$[[ inputs.plugin-version ]]'
    DEPENDENCY_CHECK_CVSS: '$[[ inputs.fail-cvss ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      : "${NVD_API_KEY:?Configure NVD_API_KEY or adapt this component for an approved feed mirror}"
      ./mvnw --batch-mode --no-transfer-progress -DskipTests -DskipITs install \
        "org.owasp:dependency-check-maven:$DEPENDENCY_CHECK_VERSION:aggregate" \
        "-DfailBuildOnCVSS=$DEPENDENCY_CHECK_CVSS" -DfailOnError=true \
        -DnvdApiKeyEnvironmentVariable=NVD_API_KEY -Dformat=HTML,JSON \
        "-DoutputDirectory=$CI_MODULE_OUTPUT_DIR"
      test -s "$CI_MODULE_OUTPUT_DIR/dependency-check-report.json"
      emit REPORT_DIR ".ci-output/$CI_JOB_NAME"
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

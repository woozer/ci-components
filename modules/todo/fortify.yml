# Run an edition-specific Fortify scan and enforce policy for that exact scan
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'fortify'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'analyze'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '2h'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'FORTIFY'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    scan-adapter:
      description: 'Repository-relative scan adapter implementing docs/fortify-adapters.md'
      type: 'string'
    gate-adapter:
      description: 'Repository-relative policy adapter; must fail on policy violation'
      type: string
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    FORTIFY_SCAN_ADAPTER: '$[[ inputs.scan-adapter ]]'
    FORTIFY_GATE_ADAPTER: '$[[ inputs.gate-adapter ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      python3 - <<'PY'
      import json, os, pathlib, subprocess

      root = pathlib.Path(os.environ['CI_PROJECT_DIR'])
      output = pathlib.Path(os.environ['CI_MODULE_OUTPUT_DIR'])
      receipt_path, report_path = output / 'scan.json', output / 'policy.json'
      subprocess.run(['sh', str(root / os.environ['FORTIFY_SCAN_ADAPTER']),
                      '--receipt', str(receipt_path), '--commit', os.environ['CI_COMMIT_SHA'],
                      '--pipeline-id', os.environ['CI_PIPELINE_ID']], check=True)
      receipt = json.loads(receipt_path.read_text())
      if (receipt['commit_sha'] != os.environ['CI_COMMIT_SHA']
              or str(receipt['pipeline_id']) != os.environ['CI_PIPELINE_ID']
              or receipt['status'] != 'completed' or not receipt['scan_id']):
          raise SystemExit('Fortify receipt must identify a completed scan of this commit and pipeline')
      subprocess.run(['sh', str(root / os.environ['FORTIFY_GATE_ADAPTER']),
                      '--receipt', str(receipt_path), '--report', str(report_path)], check=True)
      report = json.loads(report_path.read_text())
      if (report['scan_id'] != receipt['scan_id']
              or not report['policy_version'] or report['status'] != 'passed'):
          raise SystemExit('Fortify policy must pass for the exact completed scan')
      PY
      emit RECEIPT ".ci-output/$CI_JOB_NAME/scan.json"
      emit REPORT ".ci-output/$CI_JOB_NAME/policy.json"
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

# Build/tests start immediately. Choose modes on New pipeline.
# configure-deploy allows cluster/Helm choices before deployment; defaults after 10s.
# All job order and release policy live in the single central java-service.yml.
# Keep the shared form and implementation pinned to the same library revision.
spec:
  include:
    - project: root/ci-components
      ref: '1.0.0'
      file: /config/pipeline-inputs.yml
---
include:
  - project: root/ci-components
    ref: &ci_strategy '1.0.0'
    file: /pipelines/java-service.yml
    inputs:
      library-ref: *ci_strategy
      maven-project: hello-app
      release-line: "0.1"
      ui-directory: ui
      cluster: $[[ inputs.cluster ]]
      user-config: $[[ inputs.user_config ]]
      pipeline-mode: $[[ inputs.pipeline_mode ]]

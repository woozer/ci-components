# Central strategy; applications supply settings, never job scripts.
spec:
  inputs:
    library-ref:
      description: "Immutable commit of this CI library"
      type: string
    library-project:
      description: "GitLab project containing the central strategy"
      type: string
      default: "root/ci-components"
    application:
      description: "Application and chart name"
      type: string
    maven-project:
      description: "Maven module containing the application and Jib"
      type: string
    chart:
      description: "Application Helm chart directory"
      type: string
    values-file:
      description: "Helm values for the dev environment"
      type: string
    namespace:
      description: "Existing dev namespace"
      type: string
    dev-url:
      description: "Dev base URL reachable from CI"
      type: string
    dev-public-url:
      description: "Dev URL displayed in GitLab"
      type: string
    kubeconfig-variable:
      description: "GitLab file variable holding the dev kubeconfig"
      type: string
      default: "LOCAL_KUBECONFIG"
    runner-tags:
      type: array
      default: [local-docker]
    plain-http:
      type: boolean
      default: false
    helm-major:
      type: number
      default: 4
    version:
      description: 'Resolved application version'
      type: string
    commit:
      description: 'Exact application commit'
      type: string
    release-build:
      description: 'Set by the central release strategy'
      type: boolean
      default: false
---
include:
  - local: /config/organization.yml
  - local: /templates/maven-build.yml
    inputs:
      job-name: build-release
      stage: build
      image: $MAVEN_BUILD_IMAGE
      maven-executable: mvn
  - local: /templates/cucumber-test.yml
    inputs:
      job-name: test-release
      stage: test
      image: $CUCUMBER_TEST_IMAGE
      maven-executable: mvn
      target-url-variable: ''
  - local: /templates/maven-publish.yml
    inputs:
      job-name: publish-maven-release
      stage: publish
      image: $MAVEN_PUBLISH_IMAGE
      maven-executable: mvn
      project-selector: $[[ inputs.maven-project ]]
      settings-file: $MAVEN_PUBLISH_SETTINGS
      repository-id: gitlab-maven
      repository-url: $GITLAB_INTERNAL_URL/api/v4/projects/$CI_PROJECT_ID/packages/maven
  - local: /templates/jib-build.yml
    inputs:
      job-name: publish-image
      stage: image
      image: $JIB_BUILD_IMAGE
      maven-executable: mvn
      project-selector: $[[ inputs.maven-project ]]
      settings-file: $ARTIFACTORY_MAVEN_SETTINGS
      image-repository: $OCI_REGISTRY/$PUBLISH_REPOSITORY/$[[ inputs.application ]]
      image-tag: $APP_VERSION
      base-image: $JIB_BASE_IMAGE
      digest-file: $[[ inputs.maven-project ]]/target/jib-image.digest
      allow-insecure-registry: $[[ inputs.plain-http ]]
      output-prefix: JIB
  - local: /templates/helm-publish.yml
    inputs:
      job-name: publish-chart
      stage: image
      image: $HELM_PUBLISH_IMAGE
      chart: $[[ inputs.chart ]]
      chart-name: $[[ inputs.application ]]
      chart-version: $APP_VERSION
      app-version: $APP_VERSION
      oci-repository: oci://$OCI_REGISTRY/$PUBLISH_REPOSITORY/charts
      plain-http: $[[ inputs.plain-http ]]
      output-prefix: CHART
  - local: /templates/helm-deploy.yml
    inputs:
      job-name: deploy-dev
      stage: deploy
      image: $HELM_DEPLOY_IMAGE
      image-ref-variable: JIB_IMAGE_REF
      chart-variable: CHART_REF
      chart-version-variable: CHART_VERSION
      kubeconfig-variable: $[[ inputs.kubeconfig-variable ]]
      create-namespace: false
      plain-http: $[[ inputs.plain-http ]]
      values-file: $[[ inputs.values-file ]]
      release: $[[ inputs.application ]]
      namespace: $[[ inputs.namespace ]]
      environment: $DEPLOY_ENVIRONMENT
      target-url: $[[ inputs.dev-url ]]
      timeout: 5m
      helm-major: $[[ inputs.helm-major ]]
      output-prefix: DEPLOY
  - local: /templates/cucumber-test.yml
    inputs:
      job-name: cucumber-dev
      stage: integration
      image: $CUCUMBER_TEST_IMAGE
      maven-executable: mvn
      target-url-variable: DEPLOY_URL

  - local: /templates/release-check.yml
    inputs:
      job-name: check-release
      image: $MAVEN_BUILD_IMAGE
      version: '$[[ inputs.version ]]'
      commit: '$[[ inputs.commit ]]'
      image-path: '$RELEASE_OCI_REPOSITORY/$[[ inputs.application ]]'
      chart-path: '$RELEASE_OCI_REPOSITORY/charts/$[[ inputs.application ]]'
  - local: /templates/gitlab-release.yml
    inputs:
      job-name: finish-release
      image: $MAVEN_BUILD_IMAGE
      version: '$[[ inputs.version ]]'
      artifact-expire-in: never
      description: 'Validated in dev. Production delivery through Argo CD must use this image digest without rebuilding.'

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && "$[[ inputs.release-build ]]" == "true"'
      variables:
        PUBLISH_REPOSITORY: $RELEASE_OCI_REPOSITORY
        ARTIFACT_ENVIRONMENT: release/publish
        DEPLOY_ENVIRONMENT: release/dev
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

stages: [check, build, test, publish, image, deploy, integration, finish]

default:
  tags: $[[ inputs.runner-tags ]]
  interruptible: false

variables:
  RELEASE_BUILD: '$[[ inputs.release-build ]]'
  PUBLISH_REPOSITORY: $OCI_REPOSITORY
  ARTIFACT_ENVIRONMENT: dev
  DEPLOY_ENVIRONMENT: dev
  APP_VERSION: '$[[ inputs.version ]]'
  RELEASE_COMMIT: '$[[ inputs.commit ]]'
  MAVEN_ARGS: '-Drevision=$APP_VERSION'
  MAVEN_USER_HOME: '$CI_PROJECT_DIR/.m2'
  MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'

.helm-login:
  before_script:
    - !reference [.ci-module, before_script]
    - |
      set --
      if [ '$[[ inputs.plain-http ]]' = true ]; then set -- --plain-http; fi
      helm registry login "$OCI_REGISTRY" --username "$ARTIFACTORY_USERNAME" \
        --password-stdin "$@" < "$ARTIFACTORY_PASSWORD_FILE"

.release-job:
  # Environment-scoped credentials select the publisher without overwrite rights.
  environment:
    name: $ARTIFACT_ENVIRONMENT
    action: prepare

.maven-cache:
  cache:
    key: maven-java-25
    paths: [.m2/]

check-release:
  rules:
    - if: '$RELEASE_BUILD == "true"'
  extends: .release-job
  stage: check
  image: $MAVEN_BUILD_IMAGE
  variables:
    GIT_DEPTH: '0'

build-release:
  rules:
    - if: '$RELEASE_BUILD == "true"'
  extends: [.release-job, .maven-cache]

test-release:
  rules:
    - if: '$RELEASE_BUILD == "true"'
  extends: [.release-job, .maven-cache]

publish-maven-release:
  rules:
    - if: '$RELEASE_BUILD == "true"'
  extends: [.release-job, .maven-cache]

publish-image:
  extends: [.release-job, .maven-cache]

publish-chart:
  extends: .release-job
  before_script:
    - !reference [.helm-login, before_script]

deploy-dev:
  before_script:
    - !reference [.helm-login, before_script]
  needs:
    - job: publish-image
      artifacts: true
    - job: publish-chart
      artifacts: true
  environment:
    url: $[[ inputs.dev-public-url ]]

cucumber-dev:
  extends: [.release-job, .maven-cache]
  needs:
    - job: deploy-dev
      artifacts: true

finish-release:
  rules:
    - if: '$RELEASE_BUILD == "true"'
  extends: .release-job
  stage: finish
  image: $MAVEN_BUILD_IMAGE
  needs:
    - job: publish-image
      artifacts: true
    - job: publish-chart
      artifacts: true
    - job: cucumber-dev
      artifacts: false

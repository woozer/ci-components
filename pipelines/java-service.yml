# One central composition. Modules own commands; this file owns job order/policy.
# The ordinary pipeline and its deployment/release children use this same file.
spec:
  inputs:
    library-ref:
      description: 'Component release version or full commit SHA; use the same value as include.ref'
    library-project:
      default: root/ci-components
    runner-tags:
      description: 'Runner tags selected by the platform team'
      type: array
      default: [local-docker]
    buildkit-runner-tags:
      description: 'Runner tags for rootless BuildKit'
      type: array
      default: [local-buildkit]
    registry-plain-http:
      description: 'Local demo only; set false for an HTTPS organization registry'
      type: boolean
      default: true
    kubeconfig-variable:
      description: 'GitLab file variable; empty uses the agent-provided KUBECONFIG and KUBE_CONTEXT'
      default: LOCAL_KUBECONFIG
      regex: '^([A-Z][A-Z0-9_]*)?$'
    clusters:
      description: 'Cluster choices configured by the platform team'
      type: array
      default: [local]
    user-configs:
      description: 'Available environment/user profiles'
      type: array
      default: [default, two-replicas]
    maven-project:
      description: 'Deployable Maven module containing Jib'
    application:
      default: '$CI_PROJECT_NAME'
    chart:
      default: 'helm/$CI_PROJECT_NAME'
    ui-directory:
      description: 'Optional Angular/npm deployable; empty keeps a backend-only pipeline'
      default: ''
    ui-application:
      default: '$CI_PROJECT_NAME-ui'
    ui-chart:
      default: 'helm/$CI_PROJECT_NAME-ui'
    ui-publish-needs:
      description: 'Internal: UI producers and backend deployment'
      type: array
      default:
        - job: publish-ui-image
          artifacts: true
        - job: publish-ui-chart
          artifacts: true
        - job: helm-deploy
          artifacts: false
    namespace:
      default: '$CI_PROJECT_NAME'
    deployment-timeout:
      description: 'Helm readiness timeout per deployable; allow extra job time for rollback'
      default: 5m
    environment-directory:
      default: environment
    cluster:
      default: local
      regex: '^[a-z0-9][a-z0-9-]*$'
    user-config:
      default: default
      regex: '^[a-z0-9][a-z0-9-]*$'
    pipeline-mode:
      description: 'Choose before pipeline creation; runtime choices affect deployment only'
      default: deploy
      options: [validate, publish, deploy]
    flow:
      description: 'Internal: ordinary pipeline, deployment of existing artifacts, or reserved release'
      default: pipeline
      options: [pipeline, deploy, release]
    version:
      description: 'Internal: retain the producing pipeline version in child pipelines'
      default: '0.0.0-dev.$CI_PIPELINE_IID.g$CI_COMMIT_SHORT_SHA'
    commit:
      default: '$CI_COMMIT_SHA'
    publish-needs:
      description: 'Internal: image/chart producers; deployment children refer to their parent'
      type: array
      default:
        - job: publish-image
          artifacts: true
        - job: publish-chart
          artifacts: true
---
include:
  - local: /config/organization.yml
  - local: /shared/helm.yml
  - local: /templates/maven-build.yml
    inputs:
      job-name: build
      stage: build
      image: $MAVEN_BUILD_IMAGE
      maven-executable: mvn
  - local: /templates/cucumber-test.yml
    inputs:
      job-name: test
      stage: test
      image: $CUCUMBER_TEST_IMAGE
      maven-executable: mvn
      target-url-variable: ''
      tags: 'not @ui and not @ignore'
  - local: /templates/cucumber-test.yml
    inputs:
      job-name: test-custom
      stage: test
      image: $CUCUMBER_TEST_IMAGE
      maven-executable: mvn
      target-url-variable: ''
      tags: 'not @ui and not @ignore'
  - local: /templates/npm-build.yml
    inputs:
      job-name: build-ui
      stage: build
      image: $NPM_BUILD_IMAGE
      working-directory: '$[[ inputs.ui-directory ]]'
  - local: /templates/sonar.yml
    inputs:
      image: $SONAR_IMAGE
      maven-executable: mvn
  - local: /templates/dependency-check.yml
    inputs:
      image: $DEPENDENCY_CHECK_IMAGE
      maven-executable: mvn
      nvd-datafeed-url: $NVD_DATAFEED_URL
  - local: /templates/npm-test.yml
    inputs:
      job-name: test-ui
      image: $NPM_TEST_IMAGE
      working-directory: '$[[ inputs.ui-directory ]]'
  - local: /templates/image-build.yml
    inputs:
      job-name: publish-ui-image
      stage: image
      image: $IMAGE_BUILD_IMAGE
      working-directory: '$[[ inputs.ui-directory ]]'
      registry: $OCI_REGISTRY
      registry-username: $ARTIFACTORY_USERNAME
      registry-password-file: $ARTIFACTORY_PASSWORD_FILE
      image-repository: '$OCI_REGISTRY/$PUBLISH_REPOSITORY/$[[ inputs.ui-application ]]'
      image-tag: $APP_VERSION
      base-image: $NGINX_BASE_IMAGE
      plain-http: $[[ inputs.registry-plain-http ]]
      output-prefix: UI_IMAGE
  - local: /templates/helm-publish.yml
    inputs:
      job-name: publish-ui-chart
      stage: image
      image: $HELM_PUBLISH_IMAGE
      chart: '$[[ inputs.ui-chart ]]'
      chart-name: '$[[ inputs.ui-application ]]'
      chart-version: $APP_VERSION
      app-version: $APP_VERSION
      oci-repository: oci://$OCI_REGISTRY/$PUBLISH_REPOSITORY/charts
      plain-http: $[[ inputs.registry-plain-http ]]
      output-prefix: UI_CHART
  - local: /templates/maven-publish.yml
    inputs:
      job-name: publish-maven
      stage: publish
      image: $MAVEN_PUBLISH_IMAGE
      maven-executable: mvn
      project-selector: '$[[ inputs.maven-project ]]'
      settings-file: $MAVEN_PUBLISH_SETTINGS
      repository-id: $MAVEN_PUBLISH_SERVER_ID
      repository-url: $MAVEN_PUBLISH_URL
  - local: /templates/jib-build.yml
    inputs:
      job-name: publish-image
      stage: image
      image: $JIB_BUILD_IMAGE
      maven-executable: mvn
      project-selector: '$[[ inputs.maven-project ]]'
      settings-file: $ARTIFACTORY_MAVEN_SETTINGS
      image-repository: '$OCI_REGISTRY/$PUBLISH_REPOSITORY/$[[ inputs.application ]]'
      image-tag: $APP_VERSION
      base-image: $JIB_BASE_IMAGE
      digest-file: '$[[ inputs.maven-project ]]/target/jib-image.digest'
      allow-insecure-registry: $[[ inputs.registry-plain-http ]]
      output-prefix: JIB
  - local: /templates/helm-publish.yml
    inputs:
      job-name: publish-chart
      stage: image
      image: $HELM_PUBLISH_IMAGE
      chart: '$[[ inputs.chart ]]'
      chart-name: '$[[ inputs.application ]]'
      chart-version: $APP_VERSION
      app-version: $APP_VERSION
      oci-repository: oci://$OCI_REGISTRY/$PUBLISH_REPOSITORY/charts
      plain-http: $[[ inputs.registry-plain-http ]]
      output-prefix: CHART
  - local: /templates/deployment-select.yml
    inputs:
      job-name: configure-deploy
      image: $MAVEN_BUILD_IMAGE
      clusters: $[[ inputs.clusters ]]
      user-configs: $[[ inputs.user-configs ]]
      default-cluster: '$[[ inputs.cluster ]]'
      default-user-config: '$[[ inputs.user-config ]]'
      pipeline-config: |
        include:
          - project: '$[[ inputs.library-project ]]'
            ref: '$[[ inputs.library-ref ]]'
            file: /pipelines/java-service.yml
            inputs:
              flow: deploy
              chart: '$[[ inputs.chart | expand_vars ]]'
              library-ref: '$[[ inputs.library-ref ]]'
              library-project: '$[[ inputs.library-project ]]'
              runner-tags: $[[ inputs.runner-tags ]]
              buildkit-runner-tags: $[[ inputs.buildkit-runner-tags ]]
              registry-plain-http: $[[ inputs.registry-plain-http ]]
              kubeconfig-variable: '$[[ inputs.kubeconfig-variable ]]'
              clusters: $[[ inputs.clusters ]]
              user-configs: $[[ inputs.user-configs ]]
              maven-project: '$[[ inputs.maven-project ]]'
              ui-directory: '$[[ inputs.ui-directory ]]'
              ui-application: '$[[ inputs.ui-application | expand_vars ]]'
              ui-chart: '$[[ inputs.ui-chart | expand_vars ]]'
              application: '$[[ inputs.application | expand_vars ]]'
              namespace: '$[[ inputs.namespace | expand_vars ]]'
              deployment-timeout: '$[[ inputs.deployment-timeout ]]'
              environment-directory: '$[[ inputs.environment-directory ]]'
              cluster: '@CLUSTER@'
              user-config: '@USER_CONFIG@'
              version: '$APP_VERSION'
              publish-needs:
                - pipeline: '$CI_PIPELINE_ID'
                  job: publish-image
                - pipeline: '$CI_PIPELINE_ID'
                  job: publish-chart
              ui-publish-needs:
                - pipeline: '$CI_PIPELINE_ID'
                  job: publish-ui-image
                - pipeline: '$CI_PIPELINE_ID'
                  job: publish-ui-chart
                - job: helm-deploy
                  artifacts: false
  - local: /templates/release-reserve.yml
    inputs:
      job-name: start-release
      image: $MAVEN_BUILD_IMAGE
      artifact-expire-in: never
      pipeline-config: |
        include:
          - project: '$[[ inputs.library-project ]]'
            ref: '$[[ inputs.library-ref ]]'
            file: /pipelines/java-service.yml
            inputs:
              flow: release
              library-ref: '$[[ inputs.library-ref ]]'
              library-project: '$[[ inputs.library-project ]]'
              runner-tags: $[[ inputs.runner-tags ]]
              buildkit-runner-tags: $[[ inputs.buildkit-runner-tags ]]
              registry-plain-http: $[[ inputs.registry-plain-http ]]
              kubeconfig-variable: '$[[ inputs.kubeconfig-variable ]]'
              clusters: $[[ inputs.clusters ]]
              user-configs: $[[ inputs.user-configs ]]
              application: '$[[ inputs.application | expand_vars ]]'
              maven-project: '$[[ inputs.maven-project ]]'
              ui-directory: '$[[ inputs.ui-directory ]]'
              ui-application: '$[[ inputs.ui-application | expand_vars ]]'
              ui-chart: '$[[ inputs.ui-chart | expand_vars ]]'
              chart: '$[[ inputs.chart | expand_vars ]]'
              namespace: '$[[ inputs.namespace | expand_vars ]]'
              deployment-timeout: '$[[ inputs.deployment-timeout ]]'
              environment-directory: '$[[ inputs.environment-directory ]]'
              cluster: '$SELECTION_CLUSTER'
              user-config: '$SELECTION_USER_CONFIG'
              version: '@RELEASE_VERSION@'
              commit: '@RELEASE_COMMIT@'
  - local: /templates/release-check.yml
    inputs:
      job-name: check-release
      image: $MAVEN_BUILD_IMAGE
      version: '$[[ inputs.version ]]'
      commit: '$[[ inputs.commit ]]'
      image-path: '$RELEASE_OCI_REPOSITORY/$[[ inputs.application ]]'
      chart-path: '$RELEASE_OCI_REPOSITORY/charts/$[[ inputs.application ]]'
  - local: /templates/release-check.yml
    inputs:
      job-name: check-ui-release
      image: $MAVEN_BUILD_IMAGE
      version: '$[[ inputs.version ]]'
      commit: '$[[ inputs.commit ]]'
      image-path: '$RELEASE_OCI_REPOSITORY/$[[ inputs.ui-application ]]'
      chart-path: '$RELEASE_OCI_REPOSITORY/charts/$[[ inputs.ui-application ]]'
      output-prefix: UI_RELEASE_CHECK
  - local: /templates/helm-deploy.yml
    inputs:
      job-name: helm-deploy-ui
      stage: deploy
      image: $HELM_DEPLOY_IMAGE
      image-ref-variable: UI_IMAGE_IMAGE_REF
      chart-variable: UI_CHART_REF
      chart-version-variable: UI_CHART_VERSION
      kubeconfig-variable: '$[[ inputs.kubeconfig-variable ]]'
      create-namespace: false
      plain-http: $[[ inputs.registry-plain-http ]]
      values-file: '$[[ inputs.environment-directory ]]/cluster/$[[ inputs.cluster ]].yaml'
      override-values-file: '$[[ inputs.environment-directory ]]/user/$[[ inputs.user-config ]].yaml'
      release: '$[[ inputs.ui-application ]]'
      namespace: '$[[ inputs.namespace ]]'
      environment: $DEPLOY_ENVIRONMENT
      target-url: $UI_TARGET_URL
      timeout: '$[[ inputs.deployment-timeout ]]'
      output-prefix: UI_DEPLOY
  - local: /templates/cucumber-test.yml
    inputs:
      job-name: cucumber-ui
      image: $CUCUMBER_UI_IMAGE
      maven-executable: mvn
      target-url-variable: UI_DEPLOY_URL
      profile: ui
      tags: '@ui or @animals'
      output-prefix: UI_CUCUMBER
  - local: /templates/helm-deploy.yml
    inputs:
      job-name: helm-deploy
      stage: deploy
      image: $HELM_DEPLOY_IMAGE
      image-ref-variable: JIB_IMAGE_REF
      chart-variable: CHART_REF
      chart-version-variable: CHART_VERSION
      kubeconfig-variable: '$[[ inputs.kubeconfig-variable ]]'
      create-namespace: false
      plain-http: $[[ inputs.registry-plain-http ]]
      values-file: '$[[ inputs.environment-directory ]]/cluster/$[[ inputs.cluster ]].yaml'
      override-values-file: '$[[ inputs.environment-directory ]]/user/$[[ inputs.user-config ]].yaml'
      release: '$[[ inputs.application ]]'
      namespace: '$[[ inputs.namespace ]]'
      environment: $DEPLOY_ENVIRONMENT
      target-url: $DEV_TARGET_URL
      timeout: '$[[ inputs.deployment-timeout ]]'
      output-prefix: DEPLOY
  - local: /templates/cucumber-test.yml
    inputs:
      job-name: cucumber-dev
      image: $CUCUMBER_TEST_IMAGE
      maven-executable: mvn
      target-url-variable: DEPLOY_URL
      tags: 'not @ui and not @ignore'
  - local: /templates/gitlab-release.yml
    inputs:
      job-name: publish-release
      image: $MAVEN_BUILD_IMAGE
      api-url: $GITLAB_INTERNAL_URL/api/v4
      artifact-base-url: $ARTIFACTORY_PUBLIC_URL/artifactory
      version: '$[[ inputs.version ]]'
      artifact-expire-in: never
      additional-artifact-prefixes: $RELEASE_EXTRA_ARTIFACTS
      description: 'Validated in dev. Production delivery through Argo CD must use this image digest without rebuilding.'

workflow:
  name: '$JAVA_SERVICE_PIPELINE_NAME'
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && "$[[ inputs.flow ]]" == "release"'
      variables:
        JAVA_SERVICE_PIPELINE_NAME: 'Release — $[[ inputs.version ]]'
        PUBLISH_REPOSITORY: $RELEASE_OCI_REPOSITORY
        ARTIFACT_ENVIRONMENT: release/publish
        DEPLOY_ENVIRONMENT: 'release/dev/$[[ inputs.cluster ]]'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && "$[[ inputs.flow ]]" == "deploy"'
      variables:
        JAVA_SERVICE_PIPELINE_NAME: 'Dev — deployment en integratietests'
    - if: '"$[[ inputs.flow ]]" != "pipeline"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        JAVA_SERVICE_PIPELINE_NAME: 'CI — $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - when: never

stages: [check, build, test, analyze, publish, image, configure, deploy, integration, release, release-delivery, finish]

default:
  tags: $[[ inputs.runner-tags ]]

variables:
  JAVA_SERVICE_PIPELINE_NAME: 'CI — $CI_COMMIT_BRANCH'
  HELM_REGISTRY_PLAIN_HTTP: '$[[ inputs.registry-plain-http ]]'
  APP_VERSION: '$[[ inputs.version ]]'
  RELEASE_COMMIT: '$[[ inputs.commit ]]'
  PUBLISH_REPOSITORY: $OCI_REPOSITORY
  ARTIFACT_ENVIRONMENT: dev
  DEPLOY_ENVIRONMENT: 'dev/$[[ inputs.cluster ]]'
  MAVEN_ARGS: '-Drevision=$APP_VERSION'
  MAVEN_USER_HOME: '$CI_PROJECT_DIR/.m2'
  MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'

.maven-cache:
  cache:
    key: maven-java-25
    paths: [.m2/]

.publish:
  environment:
    name: $ARTIFACT_ENVIRONMENT
    action: prepare
  rules:
    - if: '"$[[ inputs.flow ]]" == "release"'
    - if: '"$[[ inputs.flow ]]" == "pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && "$[[ inputs.pipeline-mode ]]" != "validate"'

.validation:
  environment:
    name: $ARTIFACT_ENVIRONMENT
    action: prepare
  rules:
    - if: '"$[[ inputs.flow ]]" == "release"'
      interruptible: false
    - if: '"$[[ inputs.flow ]]" == "pipeline"'

.deployment:
  rules:
    - if: '"$[[ inputs.flow ]]" == "deploy" || "$[[ inputs.flow ]]" == "release"'

check-release:
  extends: .publish
  rules:
    - if: '"$[[ inputs.flow ]]" == "release"'
  variables:
    GIT_DEPTH: '0'

build:
  extends: [.validation, .maven-cache]
  interruptible: true

test:
  extends: [.validation, .maven-cache]
  interruptible: true
  needs: [build]

# Community Build analyzes the protected default branch; MR analysis requires
# a different Sonar edition. Dependency-Check also runs in merge requests.
sonar:
  cache:
    - !reference [.maven-cache, cache]
    - key: sonar-$CI_PROJECT_ID
      paths: [.sonar/cache/]
  rules:
    - if: '"$[[ inputs.flow ]]" == "release"'
    - if: '"$[[ inputs.flow ]]" == "pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  needs:
    - job: build
      artifacts: true
    - job: test
      artifacts: true
    - job: test-ui
      optional: true
      artifacts: true
  resource_group: sonar-$CI_PROJECT_ID
  variables:
    SONAR_USER_HOME: '$CI_PROJECT_DIR/.sonar'
    MAVEN_ARGS: '-Drevision=$APP_VERSION -Dsonar.maven.scanAll=true -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,.ci-output/**,.m2/**,.cache/**,.sonar/**'

dependency-check:
  extends: .validation
  needs: [test]
  cache:
    - !reference [.maven-cache, cache]
    - key: dependency-check-13
      paths: [.cache/dependency-check/]

# A separate developer run cannot replace the mandatory test above.
test-custom:
  extends: .maven-cache
  rules:
    - if: '"$[[ inputs.flow ]]" == "pipeline"'
      when: manual
      allow_failure: true
  needs: [build]
  inputs:
    tags:
      description: 'Cucumber scenarios: complete suite or smoke checks'
      default: 'not @ui and not @ignore'
      options: ['not @ui and not @ignore', '@smoke and not @ui']
  before_script:
    - !reference [.ci-module, before_script]
    - export CUCUMBER_TAGS='${{ job.inputs.tags }}'

publish-maven:
  extends: [.publish, .maven-cache]
  needs:
    - job: test
    - job: test-ui
      optional: true
      artifacts: false
    - job: sonar
      artifacts: false
    - job: dependency-check
      artifacts: false

publish-image:
  extends: [.publish, .maven-cache]
  needs: [publish-maven]

publish-chart:
  extends: .publish
  needs: [publish-maven]
  before_script:
    - !reference [.helm-login, before_script]

# The delay applies only to deployment, after publication has succeeded.
configure-deploy:
  rules:
    - if: '"$[[ inputs.flow ]]" == "pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && "$[[ inputs.pipeline-mode ]]" == "deploy"'
      when: delayed
      start_in: 10 seconds

deploy-dev:
  stage: deploy
  rules:
    - if: '"$[[ inputs.flow ]]" == "pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && "$[[ inputs.pipeline-mode ]]" == "deploy"'
  needs: [configure-deploy]
  inherit:
    variables: false
  # Hold the lock through Helm AND its HTTP test, including every redeployment.
  resource_group: 'dev-$[[ inputs.application ]]'
  trigger:
    include:
      - artifact: .ci-output/configure-deploy/pipeline.yml
        job: configure-deploy
    strategy: mirror

helm-deploy:
  extends: .deployment
  needs: $[[ inputs.publish-needs ]]
  before_script:
    - !reference [.helm-login, before_script]
  environment:
    url: $DEV_PUBLIC_URL

cucumber-dev:
  extends: [.deployment, .maven-cache]
  # Every deployable must be ready before either deployed integration suite starts.
  needs:
    - job: helm-deploy
      artifacts: true
    - job: helm-deploy-ui
      optional: true
      artifacts: false
  environment:
    name: $DEPLOY_ENVIRONMENT
    action: prepare

start-release:
  variables:
    GIT_DEPTH: '0'
  environment:
    name: release/reserve
    action: prepare
  rules:
    - if: '"$[[ inputs.flow ]]" == "pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && "$[[ inputs.pipeline-mode ]]" == "deploy"'
      when: manual
      allow_failure: true
  needs:
    - job: deploy-dev
      artifacts: false
    - job: configure-deploy
      artifacts: true
  resource_group: release-reservation
  interruptible: false

release-delivery:
  stage: release-delivery
  rules:
    - if: '"$[[ inputs.flow ]]" == "pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && "$[[ inputs.pipeline-mode ]]" == "deploy"'
  needs: [start-release]
  inherit:
    variables: false
  resource_group: 'dev-$[[ inputs.application ]]'
  trigger:
    include:
      - artifact: .ci-output/start-release/pipeline.yml
        job: start-release
    strategy: mirror

publish-release:
  extends: .publish
  stage: finish
  rules:
    - if: '"$[[ inputs.flow ]]" == "release" && "$[[ inputs.ui-directory ]]" != ""'
      variables:
        RELEASE_EXTRA_ARTIFACTS: 'UI_IMAGE:UI_CHART'
    - if: '"$[[ inputs.flow ]]" == "release"'
      variables:
        RELEASE_EXTRA_ARTIFACTS: ''
  needs:
    - job: publish-image
      artifacts: true
    - job: publish-chart
      artifacts: true
    - job: cucumber-dev
      artifacts: false
    - job: publish-ui-image
      optional: true
      artifacts: true
    - job: publish-ui-chart
      optional: true
      artifacts: true
    - job: cucumber-ui
      optional: true
      artifacts: false

# UI jobs use native rules/needs. Backend-only consumers leave ui-directory empty.
.ui-validation:
  extends: .validation
  rules:
    - if: '"$[[ inputs.ui-directory ]]" == ""'
      when: never
    - !reference [.validation, rules]
  cache:
    key: npm
    paths: [.npm/]
  variables:
    npm_config_cache: '$CI_PROJECT_DIR/.npm'

.ui-publish:
  extends: .publish
  rules:
    - if: '"$[[ inputs.ui-directory ]]" == ""'
      when: never
    - !reference [.publish, rules]

.ui-deployment:
  extends: .deployment
  rules:
    - if: '"$[[ inputs.ui-directory ]]" == ""'
      when: never
    - !reference [.deployment, rules]

build-ui:
  extends: .ui-validation
  interruptible: true

test-ui:
  extends: .ui-validation
  interruptible: true

publish-ui-image:
  extends: .ui-publish
  tags: $[[ inputs.buildkit-runner-tags ]]
  needs: [build-ui, publish-maven]

publish-ui-chart:
  extends: .ui-publish
  needs: [publish-maven]
  before_script:
    - !reference [.helm-login, before_script]

check-ui-release:
  extends: .publish
  rules:
    - if: '"$[[ inputs.flow ]]" == "release" && "$[[ inputs.ui-directory ]]" != ""'
  variables:
    GIT_DEPTH: '0'

helm-deploy-ui:
  extends: .ui-deployment
  needs: $[[ inputs.ui-publish-needs ]]
  before_script:
    - !reference [.helm-login, before_script]
  environment:
    url: $UI_PUBLIC_URL

cucumber-ui:
  extends: [.ui-deployment, .maven-cache]
  needs:
    - job: helm-deploy-ui
      artifacts: true
    - job: helm-deploy
      artifacts: false
  environment:
    name: $DEPLOY_ENVIRONMENT
    action: prepare

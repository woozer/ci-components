# Build and push a Dockerfile image using rootless BuildKit
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'image-build'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'package'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'IMAGE_BUILD'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    dockerfile:
      description: 'Dockerfile path relative to build context'
      type: 'string'
      default: 'Dockerfile'
    image-repository:
      description: 'Registry host/repository/image without tag'
      default: '$CI_REGISTRY_IMAGE'
    image-tag:
      description: 'Unique build or reserved release version'
      default: 'candidate-$CI_PIPELINE_ID-$CI_COMMIT_SHA'
    registry:
      description: 'Registry host including optional port'
      default: '$CI_REGISTRY'
    registry-username:
      default: '$CI_REGISTRY_USER'
    registry-password-file:
      description: 'Optional file variable; otherwise CI_REGISTRY_PASSWORD is used'
      default: ''
    plain-http:
      description: 'Only for an isolated local registry without TLS'
      type: boolean
      default: false
    base-image:
      description: 'Optional approved base, supplied as the Dockerfile BASE_IMAGE build argument'
      default: ''
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    IMAGE_DOCKERFILE: '$[[ inputs.dockerfile ]]'
    BUILD_REPOSITORY: '$[[ inputs.image-repository ]]'
    BUILD_TAG: '$[[ inputs.image-tag ]]'
    BUILD_REGISTRY: '$[[ inputs.registry ]]'
    BUILD_USERNAME: '$[[ inputs.registry-username ]]'
    BUILD_PASSWORD_FILE: '$[[ inputs.registry-password-file ]]'
    BUILD_PLAIN_HTTP: '$[[ inputs.plain-http ]]'
    BUILD_BASE_IMAGE: '$[[ inputs.base-image ]]'
    BUILDKITD_FLAGS: '--oci-worker-no-process-sandbox'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      : "${BUILD_REGISTRY:?Missing registry}"
      : "${BUILD_REPOSITORY:?Missing image repository}"
      : "${BUILD_TAG:?Missing image tag}"
      : "${BUILD_USERNAME:?Missing registry user}"
      export DOCKER_CONFIG="$CI_PROJECT_DIR/.ci-tmp/$CI_JOB_ID"
      umask 077
      mkdir -p "$DOCKER_CONFIG"
      python3 - <<'PY'
      import json, os, pathlib
      env = os.environ
      password_file = env['BUILD_PASSWORD_FILE']
      password = pathlib.Path(password_file).read_text().strip() if password_file else env.get('CI_REGISTRY_PASSWORD', '')
      if not password:
          raise SystemExit('Missing registry credential')
      directory = pathlib.Path(env['DOCKER_CONFIG'])
      config = json.loads(env.get('DOCKER_AUTH_CONFIG') or '{}')
      config.setdefault('auths', {})[env['BUILD_REGISTRY']] = {'username': env['BUILD_USERNAME'], 'password': password}
      (directory / 'config.json').write_text(json.dumps(config))
      if env['BUILD_PLAIN_HTTP'] == 'true':
          (directory / 'buildkitd.toml').write_text('[registry.' + json.dumps(env['BUILD_REGISTRY']) + ']\n  http = true\n')
      PY
      if [ "$BUILD_PLAIN_HTTP" = true ]; then
        export BUILDKITD_FLAGS="$BUILDKITD_FLAGS --config $DOCKER_CONFIG/buildkitd.toml"
      fi
      # New Docker clients prioritize DOCKER_AUTH_CONFIG over config.json.
      # The runner uses that read-only account to pull this job image; publish
      # with the explicit, environment-scoped account in our temporary config.
      unset DOCKER_AUTH_CONFIG
      set --
      if [ -n "$BUILD_BASE_IMAGE" ]; then set -- --opt "build-arg:BASE_IMAGE=$BUILD_BASE_IMAGE"; fi
      buildctl-daemonless.sh build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=. \
        --opt "filename=$IMAGE_DOCKERFILE" "$@" \
        --output "type=image,name=$BUILD_REPOSITORY:$BUILD_TAG,push=true,registry.insecure=$BUILD_PLAIN_HTTP" \
        --metadata-file "$CI_MODULE_OUTPUT_DIR/build-metadata.json"
      python3 - <<'PY'
      import json, os, pathlib, re
      output = pathlib.Path(os.environ['CI_MODULE_OUTPUT_DIR'])
      digest = json.loads((output / 'build-metadata.json').read_text())['containerimage.digest']
      if not re.fullmatch(r'sha256:[a-f0-9]{64}', digest):
          raise SystemExit('BuildKit returned an invalid image digest')
      (output / 'digest.txt').write_text(digest)
      PY
      image_digest=$(cat "$CI_MODULE_OUTPUT_DIR/digest.txt")
      emit IMAGE_REF "$BUILD_REPOSITORY@$image_digest"
      emit DIGEST "$image_digest"
    - !reference [.ci-module, script]
  after_script:
    - rm -f "$CI_PROJECT_DIR/.ci-tmp/$CI_JOB_ID/config.json"
    - !reference [.ci-module, after_script]
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

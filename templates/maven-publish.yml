# Publish Maven packages to an authenticated repository
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'maven-publish'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'publish'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'MAVEN_PUBLISH'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    maven-executable:
      description: 'Maven executable in the image or wrapper in the working directory'
      type: string
      default: ./mvnw
    project-selector:
      description: 'Optional Maven reactor projects to publish, including their dependencies'
      type: string
      default: ''
    settings-file:
      description: 'Maven settings path; credentials belong in a GitLab file variable or environment references'
      type: string
    repository-id:
      description: 'Server ID matching the Maven settings file'
      type: string
      default: maven-repository
    repository-url:
      description: 'Destination Maven repository URL'
      type: string
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    MAVEN_EXECUTABLE: '$[[ inputs.maven-executable ]]'
    MAVEN_PROJECT_SELECTOR: '$[[ inputs.project-selector ]]'
    MAVEN_SETTINGS: '$[[ inputs.settings-file ]]'
    MAVEN_REPOSITORY_ID: '$[[ inputs.repository-id ]]'
    MAVEN_REPOSITORY_URL: '$[[ inputs.repository-url ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      set --
      if [ -n "$MAVEN_PROJECT_SELECTOR" ]; then set -- -pl "$MAVEN_PROJECT_SELECTOR" -am; fi
      "$MAVEN_EXECUTABLE" --batch-mode --no-transfer-progress --settings "$MAVEN_SETTINGS" "$@" \
        deploy -DskipTests -DskipUnitTests=true -DskipITs \
        "-DaltDeploymentRepository=${MAVEN_REPOSITORY_ID}::${MAVEN_REPOSITORY_URL}"
      emit REPOSITORY_URL "$MAVEN_REPOSITORY_URL"
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

# Select deployment settings, then publish a configuration for the next pipeline.
spec:
  inputs:
    job-name:
      type: string
      default: pipeline-select
    stage:
      type: string
      default: configure
    image:
      description: 'Approved image with POSIX shell and sed'
      type: string
    job-timeout:
      type: string
      default: 30m
    artifact-expire-in:
      type: string
      default: 7 days
    working-directory:
      type: string
      default: '.'
    output-prefix:
      type: string
      default: SELECTION
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      type: string
      default: ''
    post-hook:
      type: string
      default: ''
    cleanup-hook:
      type: string
      default: ''
    hook-parameters-json:
      type: string
      default: '{}'
    start-delay:
      description: 'Start with defaults after this delay unless a user unschedules the job'
      type: string
      default: 10 seconds
    clusters:
      description: 'Centrally configured cluster choices'
      type: array
      default: [local]
    default-cluster:
      type: string
      default: local
    user-configs:
      description: 'Available environment/user/<name>.yaml profiles'
      type: array
      default: [default]
    default-user-config:
      type: string
      default: default
    pipeline-config:
      description: 'Child YAML with @CLUSTER@, @USER_CONFIG@ and @PIPELINE_MODE@ placeholders'
      type: string
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint: ['']
  when: delayed
  start_in: '$[[ inputs.start-delay ]]'
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    SELECTION_PIPELINE_YAML: '$[[ inputs.pipeline-config ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      selected_cluster='${{ job.inputs.cluster }}'
      selected_user='${{ job.inputs.user-config }}'
      selected_mode='${{ job.inputs.pipeline-mode }}'
      for name in "$selected_cluster" "$selected_user"; do
        case "$name" in
          ''|*[!a-z0-9-]*) echo 'Selection must be a lowercase name, not a path.' >&2; exit 1 ;;
        esac
      done
      case "$selected_mode" in
        validate|publish|deploy) ;;
        *) echo 'Unsupported pipeline mode.' >&2; exit 1 ;;
      esac
      printf '%s\n' "$SELECTION_PIPELINE_YAML" | sed \
        -e "s/@CLUSTER@/$selected_cluster/g" \
        -e "s/@USER_CONFIG@/$selected_user/g" \
        -e "s/@PIPELINE_MODE@/$selected_mode/g" > "$CI_MODULE_OUTPUT_DIR/pipeline.yml"
      printf 'Selected cluster=%s, user-config=%s, pipeline-mode=%s\n' "$selected_cluster" "$selected_user" "$selected_mode"
      emit CLUSTER "$selected_cluster"
      emit USER_CONFIG "$selected_user"
      emit MODE "$selected_mode"
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: always
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths: ['.ci-output/$CI_JOB_NAME/']
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'
  inputs:
    cluster:
      description: 'Cluster, configured centrally with its matching credentials'
      type: string
      default: '$[[ inputs.default-cluster ]]'
      options: $[[ inputs.clusters ]]
    user-config:
      description: 'Helm values profile from environment/user/'
      type: string
      default: '$[[ inputs.default-user-config ]]'
      options: $[[ inputs.user-configs ]]
    pipeline-mode:
      description: 'validate: build/tests; publish: add artifacts; deploy: add Helm and HTTP tests'
      type: string
      default: deploy
      options: [validate, publish, deploy]

# Reserve a unique release tag on the permitted branch
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'release-reserve'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'release'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'RELEASE'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    release-branch:
      description: "Protected branch permitted to release"
      type: string
      default: "$CI_DEFAULT_BRANCH"
    registry-url:
      description: "Artifactory URL including http or https"
      type: string
      default: "$RELEASE_REGISTRY_URL"
    registry-username:
      description: "Publisher with Read and Deploy, without Delete/Overwrite"
      type: string
      default: "$ARTIFACTORY_USERNAME"
    registry-password-file:
      description: "Path to the publisher password file"
      type: string
      default: "$ARTIFACTORY_PASSWORD_FILE"
    image-path:
      description: "Artifactory repository and image path, without tag"
      type: string
    chart-path:
      description: "Optional Artifactory repository and OCI chart path"
      type: string
      default: ""
    version:
      description: "auto selects the next patch; override with an explicit SemVer"
      type: string
      default: auto
    git-url:
      description: "Repository SSH URL used only for creating the tag"
      type: string
      default: "$RELEASE_GIT_URL"
    git-key-file:
      description: "Deploy key file permitted to create release tags"
      type: string
      default: "$RELEASE_GIT_KEY"
    git-known-hosts-file:
      description: "Pinned SSH known-hosts file"
      type: string
      default: "$RELEASE_GIT_KNOWN_HOSTS"
    pipeline-config:
      description: "Optional child pipeline YAML with @RELEASE_VERSION@ and @RELEASE_COMMIT@ placeholders"
      type: string
      default: ""
---
include:
  - local: /shared/module.yml
  - local: /shared/release.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint: ['']
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    RELEASE_BRANCH: '$[[ inputs.release-branch ]]'
    RELEASE_ARTIFACTORY_URL: '$[[ inputs.registry-url ]]'
    RELEASE_REGISTRY_USER: '$[[ inputs.registry-username ]]'
    RELEASE_REGISTRY_PASSWORD_FILE: '$[[ inputs.registry-password-file ]]'
    RELEASE_IMAGE_PATH: '$[[ inputs.image-path ]]'
    RELEASE_CHART_PATH: '$[[ inputs.chart-path ]]'
    RELEASE_TAG_GIT_URL: '$[[ inputs.git-url ]]'
    RELEASE_GIT_KEY_FILE: '$[[ inputs.git-key-file ]]'
    RELEASE_GIT_KNOWN_HOSTS_FILE: '$[[ inputs.git-known-hosts-file ]]'
    RELEASE_PIPELINE_CONFIG: '$[[ inputs.pipeline-config ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - !reference [.ci-release, script]
    - |
      RELEASE_VERSION='${{ job.inputs.version }}'
      if [ "$RELEASE_VERSION" != auto ]; then validate_version "$RELEASE_VERSION"; fi
      require_release_branch

      : "${RELEASE_GIT_KEY_FILE:?Missing release Git deploy key}"
      : "${RELEASE_GIT_KNOWN_HOSTS_FILE:?Missing pinned SSH host keys}"
      : "${RELEASE_TAG_GIT_URL:?Missing release Git URL}"
      key_dir=$(mktemp -d)
      trap 'rm -rf "$key_dir"' EXIT HUP INT TERM
      cp "$RELEASE_GIT_KEY_FILE" "$key_dir/key"
      chmod 600 "$key_dir/key"
      export GIT_SSH_COMMAND="ssh -i \"$key_dir/key\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$RELEASE_GIT_KNOWN_HOSTS_FILE\""

      if [ "$RELEASE_VERSION" = auto ]; then
        # Include all reserved versions, even when their later publication failed.
        if ! release_tags=$(git ls-remote --tags --refs --sort=-version:refname "$RELEASE_TAG_GIT_URL"); then
          fail 'Cannot list reserved release versions; automatic version selection is blocked.'
        fi
        latest=$(printf '%s\n' "$release_tags" | awk '
          !found && $2 ~ /^refs\/tags\/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ {
            sub(/^refs\/tags\/v/, "", $2); print $2; found=1
          }')
        if [ -z "$latest" ]; then
          RELEASE_VERSION=0.1.0
        else
          patch=${latest##*.}
          [ "${#patch}" -le 18 ] || fail 'Patch number exceeds automatic arithmetic; enter an explicit version.'
          RELEASE_VERSION="${latest%.*}.$((patch + 1))"
        fi
        validate_version "$RELEASE_VERSION"
        printf 'Automatic release version: %s\n' "$RELEASE_VERSION"
      fi
      require_unused_artifacts
      tag="v$RELEASE_VERSION"
      if git ls-remote --exit-code "$RELEASE_TAG_GIT_URL" "refs/tags/$tag" > /dev/null; then
        fail "Tag $tag already reserves this version; use a new version."
      else
        [ "$?" -eq 2 ] || fail 'Cannot check release tags; publication is blocked.'
      fi
      git -c user.name='Release pipeline' -c user.email='release@localhost.invalid' \
        tag -a "$tag" "$CI_COMMIT_SHA" -m "Release $RELEASE_VERSION from $CI_PIPELINE_URL (job $CI_JOB_ID)"
      # Git creates the remote ref atomically. A racing reservation fails; never force.
      git push -o ci.skip "$RELEASE_TAG_GIT_URL" "refs/tags/$tag:refs/tags/$tag"

      if [ -n "$RELEASE_PIPELINE_CONFIG" ]; then
        printf '%s\n' "$RELEASE_PIPELINE_CONFIG" | sed \
          -e "s/@RELEASE_VERSION@/$RELEASE_VERSION/g" \
          -e "s/@RELEASE_COMMIT@/$CI_COMMIT_SHA/g" > "$CI_MODULE_OUTPUT_DIR/pipeline.yml"
      fi
      emit VERSION "$RELEASE_VERSION"
      emit TAG "$tag"
      printf 'Reserved %s at %s.\n' "$tag" "$CI_COMMIT_SHA"
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: always
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths: ['.ci-output/$CI_JOB_NAME/']
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'
  inputs:
    version:
      description: 'auto: first 0.1.0, then next patch; or enter a version such as 1.0.0'
      type: string
      default: '$[[ inputs.version ]]'
      regex: '^(auto|(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'

# Enforce security policy for the exact completed Fortify scan
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'fortify-gate'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'gate'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'FORTIFY_GATE'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    adapter:
      description: 'Repository-relative policy adapter; must fail on policy violation'
      type: 'string'
    receipt-variable:
      description: 'Name of upstream scan receipt output'
      type: 'string'
      default: 'FORTIFY_SCAN_RECEIPT'
      regex: '^[A-Z][A-Z0-9_]*$'
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    FORTIFY_ADAPTER: '$[[ inputs.adapter ]]'
    FORTIFY_RECEIPT_VARIABLE: '$[[ inputs.receipt-variable ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      export FORTIFY_RECEIPT=$(runtime_input "$FORTIFY_RECEIPT_VARIABLE")
      python3 - <<'PY'
      import json, os, pathlib
      receipt = json.loads((pathlib.Path(os.environ['CI_PROJECT_DIR']) / os.environ['FORTIFY_RECEIPT']).read_text())
      assert receipt['commit_sha'] == os.environ['CI_COMMIT_SHA'], 'Wrong scanned commit'
      assert str(receipt['pipeline_id']) == os.environ['CI_PIPELINE_ID'], 'Wrong scanned pipeline'
      assert receipt['status'] == 'completed' and receipt['scan_id'], 'Incomplete scan'
      PY
      sh "$CI_PROJECT_DIR/$FORTIFY_ADAPTER" \
        --receipt "$CI_PROJECT_DIR/$FORTIFY_RECEIPT" \
        --report "$CI_MODULE_OUTPUT_DIR/policy.json"
      python3 - <<'PY'
      import json, os, pathlib
      root = pathlib.Path(os.environ['CI_PROJECT_DIR'])
      receipt = json.loads((root / os.environ['FORTIFY_RECEIPT']).read_text())
      report = json.loads((pathlib.Path(os.environ['CI_MODULE_OUTPUT_DIR']) / 'policy.json').read_text())
      assert report['scan_id'] == receipt['scan_id'], 'Policy evaluated the wrong scan'
      assert report['policy_version'] and report['status'] == 'passed', 'Fortify policy did not pass'
      PY
      emit REPORT ".ci-output/$CI_JOB_NAME/policy.json"
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

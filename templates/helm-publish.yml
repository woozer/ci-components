# Lint, package and publish one OCI Helm chart
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'helm-publish'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'package'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'HELM_PUBLISH'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    chart:
      description: 'Local chart directory'
      type: string
    chart-name:
      description: 'Name declared in Chart.yaml'
      type: string
    chart-version:
      description: 'Unique semantic version for the published chart'
      type: string
    app-version:
      description: 'Application version embedded in the chart'
      type: string
      default: $CI_COMMIT_SHA
    oci-repository:
      description: 'OCI destination prefix, such as oci://registry/repository/charts'
      type: string
    plain-http:
      description: 'Allow HTTP for an explicit local registry'
      type: boolean
      default: false
---
'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    HELM_CHART: '$[[ inputs.chart ]]'
    HELM_CHART_NAME: '$[[ inputs.chart-name ]]'
    HELM_CHART_VERSION: '$[[ inputs.chart-version ]]'
    HELM_APP_VERSION: '$[[ inputs.app-version ]]'
    HELM_OCI_REPOSITORY: '$[[ inputs.oci-repository ]]'
  before_script:
    - |
      set -eu
      cd "$CI_PROJECT_DIR/$MODULE_WORKDIR"
      export CI_MODULE_OUTPUT_DIR="$CI_PROJECT_DIR/.ci-output/$CI_JOB_NAME"
      mkdir -p "$CI_MODULE_OUTPUT_DIR"
      rm -f "$CI_MODULE_OUTPUT_DIR/outputs.env"
      export CI_MODULE_EXTRA_OUTPUTS="$CI_MODULE_OUTPUT_DIR/custom.env"
      export CI_MODULE_PARAMETERS_FILE="$CI_MODULE_OUTPUT_DIR/hook-parameters.json"
      printf '%s\n' "$MODULE_HOOK_PARAMETERS_JSON" > "$CI_MODULE_PARAMETERS_FILE"
      : > "$CI_MODULE_EXTRA_OUTPUTS"
      : > "$CI_MODULE_OUTPUT_DIR/pending.env"
      emit() {
        emit_newline='
      '
        emit_cr=$(printf '\r')
        case "$2" in
          ''|*"$emit_newline"*|*"$emit_cr"*|*'${'*)
            echo "Invalid output value for $1" >&2; return 1 ;;
        esac
        printf '%s_%s=%s\n' "$MODULE_OUTPUT_PREFIX" "$1" "$2" >> "$CI_MODULE_OUTPUT_DIR/pending.env"
      }
      runtime_input() {
        printenv "$1" || { echo "Missing upstream output variable $1; add its producer to needs" >&2; return 1; }
      }
      image_input() {
        runtime_ref=$(runtime_input "$1")
        printf '%s\n' "$runtime_ref" | LC_ALL=C grep -Eq '^.+@sha256:[a-f0-9]{64}$' || {
          echo "Expected an immutable image digest from $1" >&2; return 1;
        }
        printf '%s\n' "$runtime_ref"
      }
      if [ -n "$MODULE_PRE_HOOK" ]; then
        sh "$CI_PROJECT_DIR/$MODULE_PRE_HOOK"
      fi
  script:
    - |
      set --
      if [ '$[[ inputs.plain-http ]]' = 'true' ]; then set -- --plain-http; fi
      helm lint "$HELM_CHART"
      helm package "$HELM_CHART" --version "$HELM_CHART_VERSION" --app-version "$HELM_APP_VERSION" \
        --destination "$CI_MODULE_OUTPUT_DIR"
      helm push "$CI_MODULE_OUTPUT_DIR/$HELM_CHART_NAME-$HELM_CHART_VERSION.tgz" "$HELM_OCI_REPOSITORY" "$@"
      emit REF "${HELM_OCI_REPOSITORY%/}/$HELM_CHART_NAME"
      emit VERSION "$HELM_CHART_VERSION"
    - |
      if [ -n "$MODULE_POST_HOOK" ]; then
        sh "$CI_PROJECT_DIR/$MODULE_POST_HOOK"
      fi
      emit STATUS passed
      emit COMMIT_SHA "$CI_COMMIT_SHA"
      emit PIPELINE_ID "$CI_PIPELINE_ID"
      # Hook outputs are namespaced and cannot replace built-in output fields.
      awk -F= -v prefix="${MODULE_OUTPUT_PREFIX}_CUSTOM_" '
        index($1, prefix) != 1 { exit 1 }
      ' "$CI_MODULE_EXTRA_OUTPUTS"
      cat "$CI_MODULE_EXTRA_OUTPUTS" >> "$CI_MODULE_OUTPUT_DIR/pending.env"
      awk '
        {
          p = index($0, "="); key = substr($0, 1, p - 1); value = substr($0, p + 1)
          if (p < 2 || key !~ /^[A-Z][A-Z0-9_]*$/ || seen[key]++ || value == "" ||
              value ~ /^[[:space:]]/ || value ~ /[[:space:]]$/ || value ~ /\r/ ||
              index(value, "${")) exit 1
        }
      ' "$CI_MODULE_OUTPUT_DIR/pending.env"
      test "$(wc -c < "$CI_MODULE_OUTPUT_DIR/pending.env")" -le 5120
      mv "$CI_MODULE_OUTPUT_DIR/pending.env" "$CI_MODULE_OUTPUT_DIR/outputs.env"
  after_script:
    - |
      set -eu
      cd "$CI_PROJECT_DIR/$MODULE_WORKDIR"
      export CI_MODULE_OUTPUT_DIR="$CI_PROJECT_DIR/.ci-output/$CI_JOB_NAME"
      export CI_MODULE_EXTRA_OUTPUTS="$CI_MODULE_OUTPUT_DIR/custom.env"
      export CI_MODULE_PARAMETERS_FILE="$CI_MODULE_OUTPUT_DIR/hook-parameters.json"
      if [ -n "$MODULE_CLEANUP_HOOK" ]; then
        sh "$CI_PROJECT_DIR/$MODULE_CLEANUP_HOOK"
      fi
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

# Record the tested immutable artifacts as a GitLab release
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'gitlab-release'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'finish'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'GITLAB_RELEASE'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    version:
      description: "Release version"
      type: string
    api-url:
      description: 'GitLab API base URL reachable from the job container'
      type: string
      default: '$CI_API_V4_URL'
    image-ref-variable:
      description: "Upstream immutable image reference variable"
      type: string
      default: "JIB_IMAGE_REF"
    chart-ref-variable:
      description: "Upstream chart reference variable"
      type: string
      default: "CHART_REF"
    chart-version-variable:
      description: "Upstream chart version variable"
      type: string
      default: "CHART_VERSION"
    additional-artifact-prefixes:
      description: 'Optional space-separated IMAGE_PREFIX:CHART_PREFIX pairs for other deployables'
      default: ''
    description:
      description: "Additional release description"
      type: string
      default: ""
---
include:
  - local: /shared/module.yml
  - local: /shared/release.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint: ['']
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    RELEASE_VERSION: '$[[ inputs.version ]]'
    RELEASE_API_URL: '$[[ inputs.api-url ]]'
    RELEASE_IMAGE_VARIABLE: '$[[ inputs.image-ref-variable ]]'
    RELEASE_CHART_VARIABLE: '$[[ inputs.chart-ref-variable ]]'
    RELEASE_CHART_VERSION_VARIABLE: '$[[ inputs.chart-version-variable ]]'
    RELEASE_DESCRIPTION: '$[[ inputs.description ]]'
    RELEASE_ADDITIONAL_ARTIFACT_PREFIXES: '$[[ inputs.additional-artifact-prefixes ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - !reference [.ci-release, script]
    - |
      validate_version "$RELEASE_VERSION"
      image_ref=$(image_input "$RELEASE_IMAGE_VARIABLE")
      chart_ref=$(runtime_input "$RELEASE_CHART_VARIABLE")
      chart_version=$(runtime_input "$RELEASE_CHART_VERSION_VARIABLE")
      [ "$chart_version" = "$RELEASE_VERSION" ] || fail 'Chart and release versions differ.'
      cat > "$CI_MODULE_OUTPUT_DIR/release.md" <<EOF
      Release $RELEASE_VERSION
      
      - Commit: $CI_COMMIT_SHA
      - Image: \`$image_ref\`
      - Helm chart: \`$chart_ref\`, version \`$chart_version\`
      - Packages: $CI_PROJECT_URL/-/packages
      - Validation: $CI_PIPELINE_URL
      EOF
      # Additional deployables share this release version, each with its own digest.
      set -f
      for pair in $RELEASE_ADDITIONAL_ARTIFACT_PREFIXES; do
        printf '%s\n' "$pair" | LC_ALL=C grep -Eq '^[A-Z][A-Z0-9_]*:[A-Z][A-Z0-9_]*$' || fail 'Invalid artifact prefix pair.'
        extra_image=$(image_input "${pair%:*}_IMAGE_REF")
        extra_chart=$(runtime_input "${pair#*:}_REF")
        extra_version=$(runtime_input "${pair#*:}_VERSION")
        [ "$extra_version" = "$RELEASE_VERSION" ] || fail 'Additional chart and release versions differ.'
        printf '\n- Image: `%s`\n- Helm chart: `%s`, version `%s`\n' "$extra_image" "$extra_chart" "$extra_version" >> "$CI_MODULE_OUTPUT_DIR/release.md"
      done
      set +f
      if [ -n "$RELEASE_DESCRIPTION" ]; then
        printf '\n%s\n' "$RELEASE_DESCRIPTION" >> "$CI_MODULE_OUTPUT_DIR/release.md"
      fi
      curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" --request POST \
        --data-urlencode "tag_name=v$RELEASE_VERSION" --data-urlencode "name=Release $RELEASE_VERSION" \
        --data-urlencode "description@$CI_MODULE_OUTPUT_DIR/release.md" \
        "${RELEASE_API_URL%/}/projects/$CI_PROJECT_ID/releases" > /dev/null
      emit URL "$CI_PROJECT_URL/-/releases/v$RELEASE_VERSION"
      emit VERSION "$RELEASE_VERSION"
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: always
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths: ['.ci-output/$CI_JOB_NAME/']
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

# Build and publish an immutable application image using Jib
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'jib-build'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'package'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'JIB_BUILD'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    maven-executable:
      description: 'Maven executable in the image or wrapper in the working directory'
      type: string
      default: ./mvnw
    project-selector:
      description: 'Maven project containing the Jib plugin configuration'
      type: string
    settings-file:
      description: 'Maven settings path containing registry server credentials'
      type: string
    image-repository:
      description: 'Destination registry image repository without a tag'
      type: string
    image-tag:
      description: 'Candidate image tag'
      type: string
      default: $CI_COMMIT_SHA
    base-image:
      description: 'Approved Jib base image pinned by digest'
      type: string
    digest-file:
      description: 'Jib digest output path relative to the working directory'
      type: string
      default: target/jib-image.digest
    allow-insecure-registry:
      description: 'Allow HTTP registry credentials only for an explicit local lab'
      type: boolean
      default: false
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    MAVEN_EXECUTABLE: '$[[ inputs.maven-executable ]]'
    MAVEN_PROJECT_SELECTOR: '$[[ inputs.project-selector ]]'
    MAVEN_SETTINGS: '$[[ inputs.settings-file ]]'
    JIB_IMAGE_REPOSITORY: '$[[ inputs.image-repository ]]'
    JIB_IMAGE_TAG: '$[[ inputs.image-tag ]]'
    JIB_BASE_IMAGE: '$[[ inputs.base-image ]]'
    JIB_DIGEST_FILE: '$[[ inputs.digest-file ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      printf '%s\n' "$JIB_BASE_IMAGE" | LC_ALL=C grep -Eq '^.+@sha256:[a-f0-9]{64}$'
      set --
      if [ '$[[ inputs.allow-insecure-registry ]]' = 'true' ]; then
        set -- -Djib.allowInsecureRegistries=true -DsendCredentialsOverHttp=true
      fi
      "$MAVEN_EXECUTABLE" --batch-mode --no-transfer-progress --settings "$MAVEN_SETTINGS" \
        -pl "$MAVEN_PROJECT_SELECTOR" compile jib:build "$@" \
        "-Dcontainer.image=$JIB_IMAGE_REPOSITORY:$JIB_IMAGE_TAG" "-Dcontainer.base-image=$JIB_BASE_IMAGE"
      digest=$(cat "$JIB_DIGEST_FILE")
      printf '%s\n' "$digest" | LC_ALL=C grep -Eq '^sha256:[a-f0-9]{64}$'
      emit IMAGE_REF "$JIB_IMAGE_REPOSITORY@$digest"
      emit IMAGE_REPOSITORY "$JIB_IMAGE_REPOSITORY"
      emit IMAGE_DIGEST "$digest"
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

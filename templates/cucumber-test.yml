# Run Cucumber against a deployed URL or an application started by the suite
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'cucumber-test'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'integration'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'CUCUMBER_TEST'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    target-url-variable:
      description: 'Upstream deployment URL variable; empty when the suite starts the application'
      type: 'string'
      default: 'HELM_DEPLOY_URL'
      regex: '^([A-Z][A-Z0-9_]*)?$'
    maven-executable:
      description: 'Maven executable in the image or wrapper in the working directory'
      type: string
      default: ./mvnw
    profile:
      description: 'Optional POM profile binding Failsafe integration-test and verify'
      type: 'string'
      default: ''
    tags:
      description: 'Cucumber tag expression'
      type: 'string'
      default: 'not @ignore'
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    TARGET_URL_VARIABLE: '$[[ inputs.target-url-variable ]]'
    CUCUMBER_PROFILE: '$[[ inputs.profile ]]'
    CUCUMBER_TAGS: '$[[ inputs.tags ]]'
    MAVEN_EXECUTABLE: '$[[ inputs.maven-executable ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      set --
      if [ -n "$CUCUMBER_PROFILE" ]; then
        set -- "$@" "-P$CUCUMBER_PROFILE"
      fi
      if [ -n "$TARGET_URL_VARIABLE" ]; then
        target_url=$(runtime_input "$TARGET_URL_VARIABLE")
        set -- "$@" "-Dcucumber.base-url=$target_url"
      fi
      "$MAVEN_EXECUTABLE" --batch-mode --no-transfer-progress "$@" \
        -DskipUnitTests=true -DfailIfNoTests=true \
        "-Dcucumber.filter.tags=$CUCUMBER_TAGS" verify
      emit REPORT_ROOT "$MODULE_WORKDIR"
      if [ -n "$TARGET_URL_VARIABLE" ]; then emit TARGET_URL "$target_url"; fi
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
      - '$[[ inputs.working-directory ]]/**/target/failsafe-reports/'
      - '$[[ inputs.working-directory ]]/**/target/cucumber/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'
      junit:
        - '$[[ inputs.working-directory ]]/**/target/failsafe-reports/TEST-*.xml'

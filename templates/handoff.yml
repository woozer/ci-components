# Delegate work to a hook that explicitly requests continuation
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'handoff'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'handoff'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'HANDOFF'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    work-variable:
      description: 'Name of the upstream value delegated to the hook'
      type: 'string'
      regex: '^[A-Z][A-Z0-9_]*$'
    hook:
      description: 'Repository-relative hook; must call CI_HOOK_NEXT and return successfully'
      type: 'string'
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    HANDOFF_WORK_VARIABLE: '$[[ inputs.work-variable ]]'
    HANDOFF_HOOK: '$[[ inputs.hook ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      CI_HOOK_WORK=$(runtime_input "$HANDOFF_WORK_VARIABLE")
      export CI_HOOK_WORK
      export CI_HOOK_NEXT="$CI_MODULE_OUTPUT_DIR/next.sh"
      export CI_HOOK_CONTINUATION_DIR="$CI_MODULE_OUTPUT_DIR/continuation"
      if [ -e "$CI_HOOK_CONTINUATION_DIR" ]; then
        echo 'Unexpected existing continuation; check artifact paths and unique job names' >&2
        exit 1
      fi
      cat > "$CI_HOOK_NEXT" <<'NEXT'
      #!/bin/sh
      set -eu
      if [ "$#" -gt 1 ]; then
        echo 'Usage: next [replacement-work-value]' >&2; exit 1
      fi
      next_work=${1-"$CI_HOOK_WORK"}
      test -n "$next_work"
      mkdir "$CI_HOOK_CONTINUATION_DIR"
      printf '%s' "$next_work" > "$CI_HOOK_CONTINUATION_DIR/work.txt"
      NEXT
      chmod 700 "$CI_HOOK_NEXT"
      sh "$CI_PROJECT_DIR/$HANDOFF_HOOK"
      if [ ! -s "$CI_HOOK_CONTINUATION_DIR/work.txt" ]; then
        echo 'Handoff hook completed without calling next; continuation is blocked' >&2
        exit 1
      fi
      emit WORK_VALUE "$(cat "$CI_HOOK_CONTINUATION_DIR/work.txt")"
      emit NEXT_CALLED true
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

# Wait for and enforce the quality gate for the submitted analysis
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'sonar-gate'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'gate'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'SONAR_GATE'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    task-file-variable:
      description: 'Name of upstream task-file output'
      type: 'string'
      default: 'SONAR_SCAN_TASK_FILE'
      regex: '^[A-Z][A-Z0-9_]*$'
    timeout-seconds:
      description: 'Maximum analysis and gate wait'
      type: 'number'
      default: 600
---
'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    SONAR_TASK_VARIABLE: '$[[ inputs.task-file-variable ]]'
    SONAR_GATE_TIMEOUT: '$[[ inputs.timeout-seconds ]]'
  before_script:
    - |
      set -eu
      cd "$CI_PROJECT_DIR/$MODULE_WORKDIR"
      export CI_MODULE_OUTPUT_DIR="$CI_PROJECT_DIR/.ci-output/$CI_JOB_NAME"
      mkdir -p "$CI_MODULE_OUTPUT_DIR"
      rm -f "$CI_MODULE_OUTPUT_DIR/outputs.env"
      export CI_MODULE_EXTRA_OUTPUTS="$CI_MODULE_OUTPUT_DIR/custom.env"
      export CI_MODULE_PARAMETERS_FILE="$CI_MODULE_OUTPUT_DIR/hook-parameters.json"
      printf '%s\n' "$MODULE_HOOK_PARAMETERS_JSON" > "$CI_MODULE_PARAMETERS_FILE"
      : > "$CI_MODULE_EXTRA_OUTPUTS"
      : > "$CI_MODULE_OUTPUT_DIR/pending.env"
      emit() {
        emit_newline='
      '
        emit_cr=$(printf '\r')
        case "$2" in
          ''|*"$emit_newline"*|*"$emit_cr"*|*'${'*)
            echo "Invalid output value for $1" >&2; return 1 ;;
        esac
        printf '%s_%s=%s\n' "$MODULE_OUTPUT_PREFIX" "$1" "$2" >> "$CI_MODULE_OUTPUT_DIR/pending.env"
      }
      runtime_input() {
        printenv "$1" || { echo "Missing upstream output variable $1; add its producer to needs" >&2; return 1; }
      }
      image_input() {
        runtime_ref=$(runtime_input "$1")
        printf '%s\n' "$runtime_ref" | LC_ALL=C grep -Eq '^.+@sha256:[a-f0-9]{64}$' || {
          echo "Expected an immutable image digest from $1" >&2; return 1;
        }
        printf '%s\n' "$runtime_ref"
      }
      if [ -n "$MODULE_PRE_HOOK" ]; then
        sh "$CI_PROJECT_DIR/$MODULE_PRE_HOOK"
      fi
  script:
    - |
      export SONAR_TASK_FILE=$(runtime_input "$SONAR_TASK_VARIABLE")
      python3 - <<'PY'
      import base64, json, os, pathlib, time, urllib.parse, urllib.request
      root = pathlib.Path(os.environ['CI_PROJECT_DIR'])
      props = dict(line.split('=', 1) for line in (root / os.environ['SONAR_TASK_FILE']).read_text().splitlines() if '=' in line)
      host = os.environ['SONAR_HOST_URL'].rstrip('/')
      if urllib.parse.urlsplit(host).scheme != 'https':
          raise SystemExit('SONAR_HOST_URL must use HTTPS')
      token = base64.b64encode((os.environ['SONAR_TOKEN'] + ':').encode()).decode()
      # Refuse redirects so an unexpected destination never receives the token.
      class NoRedirect(urllib.request.HTTPRedirectHandler):
          def redirect_request(self, *args, **kwargs):
              return None
      opener = urllib.request.build_opener(NoRedirect)
      deadline = time.monotonic() + int(os.environ['SONAR_GATE_TIMEOUT'])
      def get(path, **query):
          remaining = deadline - time.monotonic()
          if remaining <= 0:
              raise SystemExit('Sonar quality gate timed out')
          url = host + path + '?' + urllib.parse.urlencode(query)
          request = urllib.request.Request(url, headers={'Authorization': 'Basic ' + token})
          with opener.open(request, timeout=min(30, remaining)) as response:
              return json.load(response)
      while True:
          task = get('/api/ce/task', id=props['ceTaskId'])['task']
          if task['status'] == 'SUCCESS':
              break
          if task['status'] not in ('PENDING', 'IN_PROGRESS'):
              raise SystemExit('Sonar analysis failed: ' + task['status'])
          time.sleep(min(5, max(0, deadline - time.monotonic())))
      result = get('/api/qualitygates/project_status', analysisId=task['analysisId'])
      output = pathlib.Path(os.environ['CI_MODULE_OUTPUT_DIR'])
      (output / 'quality-gate.json').write_text(json.dumps(result, indent=2))
      if result['projectStatus']['status'] != 'OK':
          raise SystemExit('Sonar quality gate did not pass')
      (output / 'analysis-id.txt').write_text(task['analysisId'])
      PY
      emit ANALYSIS_ID "$(cat "$CI_MODULE_OUTPUT_DIR/analysis-id.txt")"
      emit RESULT OK
    - |
      if [ -n "$MODULE_POST_HOOK" ]; then
        sh "$CI_PROJECT_DIR/$MODULE_POST_HOOK"
      fi
      emit STATUS passed
      emit COMMIT_SHA "$CI_COMMIT_SHA"
      emit PIPELINE_ID "$CI_PIPELINE_ID"
      # Hook outputs are namespaced and cannot replace built-in output fields.
      awk -F= -v prefix="${MODULE_OUTPUT_PREFIX}_CUSTOM_" '
        index($1, prefix) != 1 { exit 1 }
      ' "$CI_MODULE_EXTRA_OUTPUTS"
      cat "$CI_MODULE_EXTRA_OUTPUTS" >> "$CI_MODULE_OUTPUT_DIR/pending.env"
      awk '
        {
          p = index($0, "="); key = substr($0, 1, p - 1); value = substr($0, p + 1)
          if (p < 2 || key !~ /^[A-Z][A-Z0-9_]*$/ || seen[key]++ || value == "" ||
              value ~ /^[[:space:]]/ || value ~ /[[:space:]]$/ || value ~ /\r/ ||
              index(value, "${")) exit 1
        }
      ' "$CI_MODULE_OUTPUT_DIR/pending.env"
      test "$(wc -c < "$CI_MODULE_OUTPUT_DIR/pending.env")" -le 5120
      mv "$CI_MODULE_OUTPUT_DIR/pending.env" "$CI_MODULE_OUTPUT_DIR/outputs.env"
  after_script:
    - |
      set -eu
      cd "$CI_PROJECT_DIR/$MODULE_WORKDIR"
      export CI_MODULE_OUTPUT_DIR="$CI_PROJECT_DIR/.ci-output/$CI_JOB_NAME"
      export CI_MODULE_EXTRA_OUTPUTS="$CI_MODULE_OUTPUT_DIR/custom.env"
      export CI_MODULE_PARAMETERS_FILE="$CI_MODULE_OUTPUT_DIR/hook-parameters.json"
      if [ -n "$MODULE_CLEANUP_HOOK" ]; then
        sh "$CI_PROJECT_DIR/$MODULE_CLEANUP_HOOK"
      fi
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'

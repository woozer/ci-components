# Deploy a verified digest into one environment
spec:
  inputs:
    job-name:
      description: 'Unique job name within the consuming pipeline'
      type: 'string'
      default: 'helm-deploy'
    stage:
      description: 'Stage declared by the consuming pipeline'
      type: 'string'
      default: 'deploy-test'
    image:
      description: 'Approved tool image, pinned by digest'
      type: 'string'
    job-timeout:
      description: 'Maximum GitLab job duration; subject to runner limits'
      type: 'string'
      default: '30m'
    artifact-expire-in:
      description: 'Retention for this job output variables and artifacts'
      type: 'string'
      default: '7 days'
    working-directory:
      description: 'Repository-relative working directory'
      type: 'string'
      default: '.'
    output-prefix:
      description: 'Unique namespace for dotenv outputs'
      type: 'string'
      default: 'HELM_DEPLOY'
      regex: '^[A-Z][A-Z0-9_]*$'
    pre-hook:
      description: 'Optional repository-relative POSIX shell script before operation'
      type: 'string'
      default: ''
    post-hook:
      description: 'Optional script after success; failure fails the job'
      type: 'string'
      default: ''
    cleanup-hook:
      description: 'Optional best-effort after_script hook'
      type: 'string'
      default: ''
    hook-parameters-json:
      description: 'Non-secret JSON configuration provided as CI_MODULE_PARAMETERS_FILE'
      type: 'string'
      default: '{}'
    image-ref-variable:
      description: 'Name of upstream immutable image reference variable'
      type: 'string'
      default: 'IMAGE_VERIFY_IMAGE_REF'
      regex: '^[A-Z][A-Z0-9_]*$'
    chart:
      description: 'Local chart directory or OCI reference; alternatively use chart-variable'
      type: 'string'
      default: ''
    chart-variable:
      description: 'Optional upstream chart reference variable'
      type: string
      default: ''
      regex: '^([A-Z][A-Z0-9_]*)?$'
    chart-version-variable:
      description: 'Optional upstream chart version variable'
      type: string
      default: ''
      regex: '^([A-Z][A-Z0-9_]*)?$'
    kubeconfig-variable:
      description: 'Optional GitLab file variable containing the kubeconfig'
      type: string
      default: ''
      regex: '^([A-Z][A-Z0-9_]*)?$'
    create-namespace:
      description: 'Whether this job may create the Kubernetes namespace'
      type: boolean
      default: true
    plain-http:
      description: 'Allow HTTP for OCI chart downloads in an explicit local lab'
      type: boolean
      default: false
    values-file:
      description: 'Environment values file relative to working directory'
      type: 'string'
    override-values-file:
      description: 'Optional second values file, applied after values-file'
      type: string
      default: ''
    release:
      description: 'Helm release name'
      type: 'string'
    namespace:
      description: 'Kubernetes namespace'
      type: 'string'
    environment:
      description: 'GitLab environment name'
      type: 'string'
    target-url:
      description: 'URL that subsequent tests will call'
      type: 'string'
    helm-major:
      description: 'Major version installed in the tool image'
      type: 'number'
      default: 4
      options:
        - 3
        - 4
    timeout:
      description: 'Helm readiness timeout'
      type: 'string'
      default: '10m'
---
include:
  - local: /shared/module.yml

'$[[ inputs.job-name ]]':
  stage: '$[[ inputs.stage ]]'
  image:
    name: '$[[ inputs.image ]]'
    entrypoint:
      - ''
  allow_failure: false
  timeout: '$[[ inputs.job-timeout ]]'
  variables:
    MODULE_WORKDIR: '$[[ inputs.working-directory ]]'
    MODULE_OUTPUT_PREFIX: '$[[ inputs.output-prefix ]]'
    MODULE_PRE_HOOK: '$[[ inputs.pre-hook ]]'
    MODULE_POST_HOOK: '$[[ inputs.post-hook ]]'
    MODULE_CLEANUP_HOOK: '$[[ inputs.cleanup-hook ]]'
    MODULE_HOOK_PARAMETERS_JSON: '$[[ inputs.hook-parameters-json ]]'
    IMAGE_REF_VARIABLE: '$[[ inputs.image-ref-variable ]]'
    HELM_CHART: '$[[ inputs.chart ]]'
    HELM_VALUES: '$[[ inputs.values-file ]]'
    HELM_OVERRIDE_VALUES: '$[[ inputs.override-values-file ]]'
    HELM_RELEASE: '$[[ inputs.release ]]'
    HELM_NAMESPACE: '$[[ inputs.namespace ]]'
    HELM_TARGET_URL: '$[[ inputs.target-url ]]'
    HELM_MAJOR: '$[[ inputs.helm-major ]]'
    HELM_TIMEOUT: '$[[ inputs.timeout ]]'
    HELM_CHART_VARIABLE: '$[[ inputs.chart-variable ]]'
    HELM_CHART_VERSION_VARIABLE: '$[[ inputs.chart-version-variable ]]'
    HELM_KUBECONFIG_VARIABLE: '$[[ inputs.kubeconfig-variable ]]'
  before_script:
    - !reference [.ci-module, before_script]
  script:
    - |
      image_ref=$(image_input "$IMAGE_REF_VARIABLE")
      set --
      if [ -n "$HELM_KUBECONFIG_VARIABLE" ]; then
        kubeconfig=$(runtime_input "$HELM_KUBECONFIG_VARIABLE")
        test -f "$kubeconfig"
        set -- "$@" --kubeconfig "$kubeconfig"
      elif [ -z "${KUBE_CONTEXT:-}" ]; then
        : "${KUBECONFIG:?Configure a Kubernetes agent context or a kubeconfig file}"
      fi
      if [ -n "${KUBE_CONTEXT:-}" ]; then set -- "$@" --kube-context "$KUBE_CONTEXT"; fi
      if [ -n "$HELM_CHART_VARIABLE" ]; then HELM_CHART=$(runtime_input "$HELM_CHART_VARIABLE"); fi
      : "${HELM_CHART:?Provide a chart or an upstream chart variable}"
      case "$HELM_CHART" in
        oci://*)
          if [ '$[[ inputs.plain-http ]]' = 'true' ]; then set -- "$@" --plain-http; fi ;;
        *) helm dependency build "$HELM_CHART" ;;
      esac
      if [ -n "$HELM_CHART_VERSION_VARIABLE" ]; then
        set -- "$@" --version "$(runtime_input "$HELM_CHART_VERSION_VARIABLE")"
      fi
      if [ '$[[ inputs.create-namespace ]]' = 'true' ]; then set -- "$@" --create-namespace; fi
      case "$HELM_MAJOR" in
        3) set -- "$@" --atomic --wait ;;
        4) set -- "$@" --rollback-on-failure --wait=watcher ;;
        *) echo 'Unsupported Helm major version' >&2; exit 1 ;;
      esac
      # Helm applies later files last. Explicit digest flags below remain final.
      set -- "$@" --values "$HELM_VALUES"
      if [ -n "$HELM_OVERRIDE_VALUES" ]; then set -- "$@" --values "$HELM_OVERRIDE_VALUES"; fi
      helm upgrade --install "$HELM_RELEASE" "$HELM_CHART" \
        --namespace "$HELM_NAMESPACE" \
        --timeout "$HELM_TIMEOUT" "$@" \
        --set-string "image.repository=${image_ref%@*}" \
        --set-string "image.digest=${image_ref#*@}"
      emit IMAGE_REF "$image_ref"
      emit URL "$HELM_TARGET_URL"
      emit RELEASE "$HELM_RELEASE"
      emit NAMESPACE "$HELM_NAMESPACE"
    - !reference [.ci-module, script]
  after_script:
    - !reference [.ci-module, after_script]
  artifacts:
    when: 'always'
    expire_in: '$[[ inputs.artifact-expire-in ]]'
    paths:
      - '.ci-output/$CI_JOB_NAME/'
    reports:
      dotenv: '.ci-output/$CI_JOB_NAME/outputs.env'
  environment:
    name: '$[[ inputs.environment ]]'
    url: '$[[ inputs.target-url ]]'
  resource_group: '$[[ inputs.namespace ]]-$[[ inputs.release ]]'
